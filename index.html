<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3f0">
<meta name="format-detection" content="telephone=no">
<title>次元星域音乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231a1b1d'/%3E%3Cpath d='M9 18V6l10-2v12a3 3 0 1 1-2-2.83V8.6l-6 1.2V18a3 3 0 1 1-2-2.83z' fill='%23f4f3f0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.107211.xyz" crossorigin>
<link rel="dns-prefetch" href="https://api.107211.xyz">
<link rel="preconnect" href="https://t.alcy.cc">
<link rel="dns-prefetch" href="https://t.alcy.cc">
<link rel="preload" as="image" href="https://t.alcy.cc/tx" fetchpriority="high">
<style>
:root{
  /* ---- Material 3（Pixel）色板：单一色调体系，不用渐变、不用玻璃 ---- */
  --surface:#f9f9ff;                 /* 页面底 */
  --surface-2:#eef0fa;               /* 卡片 / 搜索条 / 面板 */
  --surface-3:#e3e6f4;               /* 再上一层：禁用态、占位块 */
  --surface-d:#1b1b21;               /* 深色面：播放条、歌词页 */
  --surface-d2:#282830;              /* 深色面上的容器 */
  --on-surface:#1a1b21;
  --on-surface-2:#45464f;            /* on-surface-variant */
  --on-surface-3:#757780;            /* 更弱一档 */
--outline-2:#dfe1ec;
  --primary:#0b57d0;
  --primary-2:#a8c7ff;               /* 深色面上的 primary */
  --primary-box:#d3e3fd;
  --on-primary:#fff;
  --ok:#2f6b3f;
  --bad:#b3261e;
  --line:#e3e6f4;                    /* 兼容旧名 */
  --line2:#c5c6d0;
  --acc:#0b57d0;
  --acc2:#0842a0;
  --accw:#d3e3fd;
  --paper:#f9f9ff;
  --card:#f9f9ff;
  --ink:#1a1b21;
  --ink2:#45464f;
  --ink3:#757780;
  --d0:#1b1b21;
  --di:#e4e2e9;
  --di2:#c5c6d0;
  --dline:#3a3a44;
  --player-h:88px;
  /* M3 圆角刻度：全站只用这几档，不随手取值 */
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:999px;
  --r:12px;
--e2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.14);
  --e3:0 4px 8px 3px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.28);
  --sans:"Google Sans",Roboto,"HarmonyOS Sans SC","MiSans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Consolas,Menlo,"Noto Sans Mono CJK SC",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);
  font-size:14px;line-height:1.5;
  background:var(--surface);color:var(--on-surface);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
img{display:block}
a{color:var(--primary)}
::selection{background:var(--primary-box);color:var(--on-surface)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c5c6d0;border-radius:99px;border:2px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:#9ea0ab}
::-webkit-scrollbar-track{background:transparent}

.wrap{max-width:760px;margin:0 auto;padding:0 20px}

/* ============ 顶栏 ============ */
.nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  height:52px;padding:0 max(20px,env(safe-area-inset-left));
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{
  width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--card);border-radius:5px;
}
.brand .logo svg{width:13px;height:13px;display:block}
.brand .nm{font-size:15px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
/* 音源检测面板默认收起：检测逻辑照跑（自动换源要用），但不摆到首页面上 */
.src-tag{display:none}
.src-tag:hover{color:var(--ink);border-color:#b9b5ab;background:#faf9f6}
.src-tag .nm{color:inherit}
.src-tag .ct{font-size:10.5px;color:#a9a69e;font-variant-numeric:tabular-nums}
.src-tag .ct.hide{display:none}
.src-tag .cv{width:0;height:0;margin-top:3px;border:3.5px solid transparent;border-top-color:currentColor;opacity:.6;transition:transform .2s,opacity .2s}
.src-tag.open .cv{transform:rotate(180deg);margin-top:-4px;opacity:.85}
.src-tag.run{color:var(--acc2);border-color:#e4cbbc;background:var(--accw)}
.src-tag.run .ct{color:var(--acc2)}
.btn{
  height:32px;padding:0 14px;border-radius:5px;
  border:1px solid var(--line2);background:var(--card);
  font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:#fff;border-color:#b9b5ab}
.btn:active{background:#f0eee9}
.btn.user{padding-right:12px}
.btn .av{width:19px;height:19px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:var(--acc);color:#fff;font-size:11px;font-weight:600}
.btn .av img{width:100%;height:100%;object-fit:cover}
.btn .nm{max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ 搜索区 ============ */
.hero{padding:38px 0 22px}
.hero.searching{padding:22px 0 18px}
.hero-t{overflow:hidden;transition:max-height .22s ease,opacity .18s ease,margin .22s ease;max-height:120px}
.hero.searching .hero-t{max-height:0;opacity:0;margin:0}
.hero h1{font-size:22px;font-weight:500;letter-spacing:0}
/* 大标题下面那行副标题：只放真数据（当前音源 + 检测结果），不放营销话 */
.hero-k{margin-top:4px;font-size:12.5px;color:var(--on-surface-2)}
.search{
  margin-top:18px;display:flex;align-items:center;gap:8px;
  height:44px;padding:0 6px 0 13px;background:var(--card);
  border:1px solid var(--line2);border-radius:var(--r);
  transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:#9d998e;box-shadow:0 0 0 3px rgba(26,27,29,.05)}
.search svg.mag{flex:none;width:16px;height:16px;color:var(--ink3)}
.search:focus-within svg.mag{color:var(--ink2)}
.search input{flex:1;min-width:0;height:100%;border:none;outline:none;background:none;font-size:14px}
.search input::placeholder{color:#a9a69e}
.search .go{
  flex:none;height:32px;padding:0 18px;border-radius:5px;
  background:var(--ink);color:#f6f5f2;font-size:13px;font-weight:500;
  transition:background .15s;
}
.search .go:hover{background:#000}
.search .go:active{background:#3d3e41}
.search .go[disabled]{background:#c9c6bf;cursor:default}

/* ============ 结果 ============ */
.results{margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.results[hidden]{display:none}
.res-hd{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.res-hd h2{font-size:13px;font-weight:600;letter-spacing:.02em}
.res-hd .n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.res-hd .all{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  font-size:12.5px;color:var(--acc2);font-weight:500;
}
.res-hd .all svg{width:12px;height:12px}
.res-hd .all:hover{text-decoration:underline}
.res-hd .all[disabled]{color:var(--ink3);cursor:default;text-decoration:none}

.songlist{list-style:none}
.songlist li{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--line);
  transition:background .12s;
  animation:rise .3s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc(var(--i,0) * 20ms);
}
.songlist li:last-child{border-bottom:0}
.songlist li:hover{background:#f7f6f3}
.songlist li.cur{background:var(--accw)}
.songlist li.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.songlist .idx{
  flex:none;width:20px;text-align:right;
  font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;
}
.songlist li.cur .idx{color:var(--acc2)}
.songlist .im{position:relative;flex:none;width:40px;height:40px;border-radius:4px;overflow:hidden;background:#ecebe6}
.songlist .im img{width:100%;height:100%;object-fit:cover}
.songlist .im .eq{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:2px;
  background:rgba(21,22,24,.55);
}
.songlist li.cur .im .eq{display:flex}
.songlist .im .eq i{width:2px;height:5px;background:#fff;animation:eq .9s ease-in-out infinite}
.songlist .im .eq i:nth-child(2){animation-delay:.22s}
.songlist .im .eq i:nth-child(3){animation-delay:.44s}
@keyframes eq{0%,100%{height:5px}50%{height:14px}}
body.paused .songlist li.cur .im .eq i{animation-play-state:paused}
.songlist .meta{flex:1;min-width:0}
.songlist .meta .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songlist li.cur .meta .t{color:var(--acc2);font-weight:500}
.songlist .meta .s{margin-top:1px;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songlist .empty{display:block;padding:38px 16px;text-align:center;font-size:13px;color:var(--ink3);cursor:default;animation:fadeIn .3s ease both}
.songlist .empty.retry{cursor:pointer;color:var(--acc2)}
.songlist .empty.retry:hover{text-decoration:underline}
.songlist .empty:hover{background:none}
/* 搜索中的骨架屏：微光横扫，不跳数字 */
.songlist li.sk{padding:11px 16px;gap:12px;cursor:default;animation:none;pointer-events:none}
.songlist li.sk:hover{background:none}
.songlist li.sk .si{width:40px;height:40px;flex:none;border-radius:4px}
.songlist li.sk .sl{flex:1;min-width:0}
.songlist li.sk .sl i,.songlist li.sk .si{
  background:linear-gradient(90deg,#ecebe6 26%,#f7f6f2 44%,#ecebe6 62%);
  background-size:280% 100%;animation:shimmer 1.4s linear infinite;
}
.songlist li.sk .sl i{display:block;height:9px;border-radius:3px}
.songlist li.sk .sl i + i{width:58%;margin-top:8px;height:8px;animation-delay:.08s}

/* ============ 底部播放器 ============ */
#audio{display:none}
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--d0);border-top:1px solid var(--dline);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -10px 34px rgba(0,0,0,.26);
}
.prog{
  position:relative;height:3px;cursor:pointer;touch-action:none;
  user-select:none;background:#33353a;transition:height .12s;
}
.prog:hover{height:6px}
.prog .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#a83d1a,#e8a473);transition:width .08s linear}
.prog .knob{
  position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform .12s;
  box-shadow:0 1px 6px rgba(0,0,0,.55);
}
.prog:hover .knob,.prog.drag .knob{transform:translate(-50%,-50%) scale(1)}
.prog.drag{height:7px}
/* 播放条改成三列栅格：左（封面+歌名） 中（上/播放/下） 右（时间）。
   中间那列是 auto，两侧各 1fr，所以控制组永远落在页面正中，
   不会被左边长歌名或右边时间挤偏。 */
.p-row{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
  height:var(--player-h);padding:0 16px;
}
.p-info{display:flex;align-items:center;gap:12px;min-width:0}
.p-row .p-ctrl{grid-column:2;justify-self:center}
.p-row .p-time{grid-column:3;justify-self:end}
.cov{
  position:relative;flex:none;width:50px;height:50px;border-radius:5px;overflow:hidden;
  background:#232528;cursor:pointer;
}
.cov img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cov:hover img{transform:scale(1.07)}
.cov .cov-mask{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(12,13,14,.55);color:#fff;opacity:0;transition:opacity .15s;
}
.cov:hover .cov-mask{opacity:1}
.cov .cov-mask svg{width:18px;height:18px}
.cov.busy .cov-mask{opacity:1}
.cov.busy .cov-mask svg{display:none}
.cov.busy .cov-mask::before{
  content:"";width:16px;height:16px;border-radius:50%;
  border:1.6px solid rgba(255,255,255,.28);border-top-color:#fff;
  animation:spin .7s linear infinite;
}
/* 正在播放：封面内侧一圈缓慢呼吸的暖光 */
.cov.live::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:5px;
  animation:halo 2.4s ease-in-out infinite;
}
@keyframes halo{
  0%,100%{box-shadow:inset 0 0 0 1px rgba(232,164,115,.24)}
  50%{box-shadow:inset 0 0 0 1px rgba(232,164,115,.72),inset 0 0 16px rgba(232,164,115,.22)}
}
body.paused .cov.live::after{animation-play-state:paused}

/* 歌名 + 歌手 */
.p-now{flex:1;min-width:0;cursor:pointer;padding:4px 0;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.p-now .t{display:flex;align-items:baseline;gap:7px;min-width:0;line-height:1.3}
.p-now .t .tt{flex:0 1 auto;min-width:0;font-size:13.5px;font-weight:500;color:var(--di);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-now .t .by{flex:0 1 auto;min-width:0;font-size:11.5px;font-weight:400;color:#7f828a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 主页播放组件里的歌词行：跟着播放走的那一句 */
.p-now .ml{display:flex;align-items:center;gap:6px;min-width:0;height:17px;font-size:11.5px;color:#aeb1b7;transition:color .2s}
.p-now .ml .c{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-now .ml .tr{flex:0 1 auto;min-width:0;color:#7f828a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
.p-now .ml .c.in,.p-now .ml .tr.in{animation:miniIn .4s cubic-bezier(.2,.8,.2,1) both}
.p-now .ml.idle{color:#6d7076}
.p-now .ml.hint{color:#d08a63}
.p-now .ml .eq{display:none;align-items:flex-end;gap:1.5px;height:9px;flex:none;padding-bottom:1px}
.p-now .ml.live .eq{display:flex}
.p-now .ml .eq i{width:2px;height:3px;background:#e8a473;border-radius:1px;animation:eq .9s ease-in-out infinite}
.p-now .ml .eq i:nth-child(2){animation-delay:.22s}
.p-now .ml .eq i:nth-child(3){animation-delay:.44s}
body.paused .p-now .ml .eq i{animation-play-state:paused}
@keyframes miniIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.p-ctrl{display:flex;align-items:center;gap:8px;flex:none}
/* 圆形幽灵按钮 */
.ic{
  position:relative;width:38px;height:38px;border-radius:50%;
  color:var(--di2);display:flex;align-items:center;justify-content:center;
  transition:color .18s,background .18s,box-shadow .18s,transform .12s;
}
.ic svg{width:18px;height:18px;display:block}
.ic:hover{color:var(--di);background:#25272b;box-shadow:inset 0 0 0 1px #3b3e44}
.ic:active{transform:scale(.9);background:#2c2f34}
/* 上一首 / 下一首：纯 CSS 画的「竖条 + 三角」标准图标。
   不用 SVG、不用字体符号、不用 emoji —— 就是两条 background 块加一个 clip-path。 */
.ic-skip::before,.ic-skip::after{content:"";position:absolute;background:currentColor;transition:transform .2s cubic-bezier(.2,.9,.25,1)}
.ic-skip::before{top:50%;width:2.5px;height:15px;margin-top:-7.5px;border-radius:2px}
.ic-skip::after{top:50%;width:12px;height:15px;margin-top:-7.5px}
.ic-prev::before{left:8.5px}
.ic-prev::after{left:13px;clip-path:polygon(100% 0,0 50%,100% 100%)}
.ic-next::before{right:8.5px}
.ic-next::after{right:13px;clip-path:polygon(0 0,100% 50%,0 100%)}
.ic-prev:hover::before,.ic-prev:hover::after{transform:translateX(-1.6px)}
.ic-next:hover::before,.ic-next:hover::after{transform:translateX(1.6px)}
/* 主按钮：播放 / 暂停 */
.ic-play{width:44px;height:44px;background:#f1f0ed;color:#151618;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.ic-play svg{width:20px;height:20px}
.ic-play:hover{background:#fff;color:#000;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.ic-play:active{transform:scale(.93);background:#ddd9d2}
.ic-play::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ic-play.ping::after{animation:ping .55s ease-out both}
.ic-play.pop svg{animation:pop .3s cubic-bezier(.2,.9,.25,1) both}
@keyframes pop{0%{transform:scale(.72)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes ping{from{box-shadow:0 0 0 0 rgba(255,255,255,.34)}to{box-shadow:0 0 0 13px rgba(255,255,255,0)}}
.p-time{flex:none;min-width:74px;text-align:right;font-size:11.5px;color:var(--di2);font-variant-numeric:tabular-nums}
.p-time .sep{margin:0 4px;color:#4e5158}

/* ============ 歌词页 ============ */
.lyr{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:var(--d0);overflow:hidden}
.lyr.on{display:flex;animation:lyrIn .4s cubic-bezier(.2,.85,.25,1) both}
/* 收起：先播完退场动画再 display:none，不然元素一摘掉就看不到动画了 */
.lyr.out{display:flex;pointer-events:none;animation:lyrOut .3s cubic-bezier(.4,0,1,1) both}
@keyframes lyrIn{from{opacity:0;transform:translate3d(0,30px,0) scale(.982)}to{opacity:1;transform:none}}
@keyframes lyrOut{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(0,22px,0) scale(.99)}}
/* 展开时各块依次落位，节奏一致 */
.lyr.on .lyr-top{animation:rise .42s .04s cubic-bezier(.2,.8,.2,1) both}
.lyr.on .lrc-wrap{animation:fadeIn .5s .1s ease both}
.lyr.on .lyr-foot{animation:rise .42s .16s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){
  .lyr.on,.lyr.out,.lyr.on .lyr-top,.lyr.on .lrc-wrap,.lyr.on .lyr-foot{animation:none}
}
.lyr .bg{
  position:absolute;inset:-60px;background-size:cover;background-position:center;
  filter:blur(64px) brightness(.34) saturate(.85);opacity:.7;
  animation:kb 34s ease-in-out infinite alternate;
}
@keyframes kb{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.17) translate3d(-1.4%,-1.2%,0)}}
.lyr .veil{position:absolute;inset:0;background:rgba(15,16,18,.72)}
.lyr .lyr-top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 20px 6px;animation:rise .42s .04s cubic-bezier(.2,.8,.2,1) both}
.lyr .lyr-top .tt{flex:1;min-width:0}
.lyr .lyr-top b{display:block;font-size:14.5px;font-weight:600;color:var(--di);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr .lyr-top span{display:block;margin-top:2px;font-size:11.5px;color:var(--di2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr .lyr-x{
  flex:none;width:32px;height:32px;border-radius:5px;color:var(--di2);
  display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
}
.lyr .lyr-x:hover{background:#24262a;color:var(--di)}
.lyr .lyr-x svg{width:16px;height:16px}
/* 歌词页只有词，居中排；不再摆封面 */
.lyr-main{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;align-items:center;padding:10px 40px}
.lyr-lrc{flex:1 1 auto;min-width:0;height:100%;animation:fadeIn .6s .12s ease both}
.lrc-box{
  position:relative;height:100%;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent);
}
.lrc-wrap{position:relative;height:100%}
/* 整列水平居中，歌词行本身也居中对齐 */
.lrc-tr{position:relative;width:100%;padding:0 8px;transition:transform .45s cubic-bezier(.25,.8,.25,1)}
.l-line{
  padding:8px 6px;font-size:15px;line-height:1.72;color:#767a81;cursor:pointer;
  text-align:center;word-break:break-word;
  transition:color .22s,font-size .26s,letter-spacing .26s,opacity .22s,font-weight .2s;
}
.l-line:hover{color:#b9bcc2}
/* 原文与翻译：同一套字号 / 字重 / 颜色，过渡和入场动画完全一致，
   两行才会「同步」地一起变大、一起淡入，而不是一快一慢。 */
.l-line .o,.l-line .tr{
  display:block;font-size:inherit;font-weight:inherit;line-height:1.6;
  letter-spacing:inherit;opacity:inherit;
  transition:color .22s,font-size .26s,letter-spacing .26s,opacity .22s,font-weight .2s;
}
.l-line .tr{margin-top:2px}
/* 正在播放：放大加重，字距略开；两行一起放大 */
.l-line.acti{
  color:var(--lrc-acc,#fff);font-size:23px;font-weight:700;letter-spacing:.015em;
  text-shadow:0 0 30px var(--lrc-acc-glow,rgba(255,255,255,.2));
}
/* 切到当前句时重放入场动画，原文和翻译一起上浮 */
.l-line.acti .o,.l-line.acti .tr{animation:lrcIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes lrcIn{from{opacity:0;transform:translateY(9px)}to{opacity:inherit;transform:none}}
.lrc-none{padding:40px 2px;font-size:13px;color:#6d7076}
.lyr .lyr-foot{position:relative;z-index:2;padding:0 40px 22px}
.lyr .lyr-prog{height:3px;margin-bottom:12px}
.lyr .lyr-bar{display:flex;align-items:center;gap:16px}
.lyr .lyr-time{flex:none;width:82px;font-size:11.5px;color:var(--di2);font-variant-numeric:tabular-nums}
.lyr .lyr-ctrl{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.lyr .lyr-tools{flex:none;display:flex;align-items:center;gap:8px;width:132px;justify-content:flex-end}
/* 播放方式：药丸按钮 + 纯 CSS 图标，三种模式各一个形状（同样不用 SVG / 字体符号） */
.lyr .ic-mode{
  width:auto;height:30px;padding:0 12px 0 10px;gap:7px;border-radius:15px;
  background:#1d1f23;box-shadow:inset 0 0 0 1px #2d3036;
  color:var(--di2);font-size:12px;line-height:1;letter-spacing:.02em;
  transition:color .18s,background .18s,box-shadow .18s,transform .12s;
}
.lyr .ic-mode:hover{color:var(--di);background:#26282d;box-shadow:inset 0 0 0 1px #3d4046}
.lyr .ic-mode:active{transform:scale(.95)}
.lyr .ic-mode.on{color:#e8a473;background:rgba(232,164,115,.1);box-shadow:inset 0 0 0 1px rgba(232,164,115,.34)}
.lyr .ic-mode .mi{position:relative;width:15px;height:15px;flex:none}
.lyr .ic-mode .tx{white-space:nowrap}
/* 顺序播放：两条横线，行尾一个小三角（走带感） */
.lyr .ic-mode[data-mode="0"] .mi::before,.lyr .ic-mode[data-mode="0"] .mi::after{
  content:"";position:absolute;left:1px;height:1.8px;border-radius:2px;background:currentColor;
}
.lyr .ic-mode[data-mode="0"] .mi::before{top:4px;width:8px}
.lyr .ic-mode[data-mode="0"] .mi::after{top:9.4px;width:12px}
.lyr .ic-mode[data-mode="0"] .mi i{
  position:absolute;right:1px;top:7.4px;width:0;height:0;
  border-top:3.2px solid transparent;border-bottom:3.2px solid transparent;
  border-left:4.6px solid currentColor;
}
/* 单曲循环：断口圆环（缺右上角）转 45°，中心一个点 */
.lyr .ic-mode[data-mode="1"] .mi::before{
  content:"";position:absolute;inset:1.4px;border-radius:50%;
  border:1.8px solid currentColor;border-top-color:transparent;border-right-color:transparent;
  transform:rotate(-42deg);
}
.lyr .ic-mode[data-mode="1"] .mi::after{
  content:"";position:absolute;left:5.5px;top:5.5px;width:4px;height:4px;border-radius:50%;background:currentColor;
}
/* 随机播放：交叉的两条线 + 右侧箭头 */
.lyr .ic-mode[data-mode="2"] .mi::before,.lyr .ic-mode[data-mode="2"] .mi::after{
  content:"";position:absolute;left:0.6px;top:50%;width:13px;height:1.8px;border-radius:2px;background:currentColor;
}
.lyr .ic-mode[data-mode="2"] .mi::before{transform:translateY(-3.4px) rotate(21deg)}
.lyr .ic-mode[data-mode="2"] .mi::after{transform:translateY(3.4px) rotate(-21deg)}
.lyr .ic-mode[data-mode="2"] .mi i{
  position:absolute;right:0.4px;top:5.3px;width:0;height:0;
  border-top:3.2px solid transparent;border-bottom:3.2px solid transparent;
  border-left:4.6px solid currentColor;
}
.lyr .ic-mode[data-mode="2"] .mi i::after{
  content:"";position:absolute;left:0.2px;top:3.1px;width:0;height:0;
  border-top:3.2px solid transparent;border-bottom:3.2px solid transparent;
  border-left:4.6px solid currentColor;opacity:.75;
}

.queue{
  position:absolute;right:20px;bottom:calc(var(--player-h) + 30px);z-index:4;
  width:min(320px,86vw);max-height:56%;display:flex;flex-direction:column;
  background:rgba(28,29,32,.97);border:1px solid var(--dline);border-radius:8px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.5);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(10px) scale(.98);
  transition:opacity .2s ease,transform .22s cubic-bezier(.2,.8,.2,1),visibility .22s;
}
.queue.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.queue .qh{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--dline);font-size:12.5px;font-weight:600;color:var(--di)}
.queue .qh .n{font-size:11px;color:var(--di2);font-weight:400;font-variant-numeric:tabular-nums}
.queue .qh .x{margin-left:auto;width:24px;height:24px;border-radius:4px;color:var(--di2);display:flex;align-items:center;justify-content:center}
.queue .qh .x:hover{background:#2b2d31;color:var(--di)}
.queue .qh .x svg{width:13px;height:13px}
.queue ol{list-style:none;overflow-y:auto}
.queue li{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s}
.queue li:hover{background:#242629}
.queue li.cur{background:#2a2119}
.queue li .t{flex:1;min-width:0;font-size:12.5px;color:#c9cbcf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue li.cur .t{color:#e0a07a;font-weight:500}
.queue li .a{flex:none;max-width:88px;font-size:11px;color:#71747a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ 登录 ============ */
.mask{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(26,27,29,.34)}
.mask.on{display:flex}
.panel{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(26,27,29,.2)}
.panel .ph{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel .ph b{font-size:13.5px;font-weight:600}
.panel .ph .x{margin-left:auto;width:26px;height:26px;border-radius:4px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.panel .ph .x:hover{background:#f0eee9;color:var(--ink)}
.panel .ph .x svg{width:14px;height:14px}
.panel .pd{display:flex;flex-direction:column;padding:6px}
.pv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;cursor:pointer;transition:background .12s}
.pv:hover{background:#f6f5f1}
.pv .lg{position:relative;width:22px;height:22px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:600;letter-spacing:.02em;overflow:hidden}
.pv .lg i{font-style:normal;line-height:1}
/* 网站自己的图标：铺满色块，浅色底才看得出透明底的 logo */
.pv .lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;background:#fff;display:block}
.pv .nm{flex:1;font-size:13.5px}
.pv .arr{font-size:15px;color:#b5b2aa}
.pv:hover .arr{color:var(--acc)}
.profile{display:flex;align-items:center;gap:10px;padding:10px;margin:6px}
.profile .av{width:36px;height:36px;flex:none;border-radius:50%;overflow:hidden;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600}
.profile .av img{width:100%;height:100%;object-fit:cover}
.profile .nm{font-size:13.5px;font-weight:500}
.profile .em{font-size:11.5px;color:var(--ink3);word-break:break-all}

/* ============ 音源检测面板 ============ */
.srcpop{
  position:absolute;top:46px;right:20px;z-index:70;
  width:min(292px,86vw);padding:7px 8px 8px;
  background:var(--card);border:1px solid var(--line2);border-radius:8px;
  box-shadow:0 18px 42px rgba(26,27,29,.18);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top right;
  transition:opacity .18s ease,transform .2s cubic-bezier(.2,.8,.2,1),visibility .2s;
}
.srcpop.on{opacity:1;visibility:visible;transform:none}
.srcpop .sp-h{display:flex;align-items:center;gap:7px;padding:3px 3px 8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.srcpop .sp-h .n{font-weight:400;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.srcpop .sp-x{position:relative;margin-left:auto;width:22px;height:22px;border-radius:4px;color:var(--ink3);transition:background .15s,color .15s}
.srcpop .sp-x:hover{background:#f0eee9;color:var(--ink)}
.srcpop .sp-x::before,.srcpop .sp-x::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.6px;background:currentColor;border-radius:2px}
.srcpop .sp-x::before{transform:translate(-50%,-50%) rotate(45deg)}
.srcpop .sp-x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.srcpop ul{list-style:none;border-top:1px solid var(--line);padding-top:5px}
.sp-row{
  position:relative;display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 6px;border-radius:5px;text-align:left;transition:background .12s;
}
.sp-row:hover{background:#f6f5f1}
.sp-row.cur{background:var(--accw)}
.sp-row .sp-nm{flex:none;font-size:12.5px;color:var(--ink)}
.sp-row.cur .sp-nm{color:var(--acc2);font-weight:600}
.sp-row .sp-st{flex:1;min-width:0;font-size:11px;color:var(--ink3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 状态圈：对勾 / 半截 / 叉号 / 转圈，全部 CSS 画，不用文字符号 */
.sp-row .sp-ic{position:relative;width:16px;height:16px;flex:none;border-radius:50%;border:1.4px solid var(--line2);transition:border-color .15s}
.sp-row .sp-ic::before,.sp-row .sp-ic::after{content:"";position:absolute;display:none}
.sp-row.ok .sp-ic{border-color:#9cc4ad;color:var(--ok)}
.sp-row.ok .sp-ic::before{display:block;left:4.3px;top:2.7px;width:4px;height:8px;border:solid currentColor;border-width:0 0 1.7px 1.7px;transform:rotate(-45deg)}
.sp-row.half .sp-ic{border-color:#dcc59b;color:#9a7434}
.sp-row.half .sp-ic::before{display:block;left:4px;top:7.2px;width:8px;height:1.7px;background:currentColor;border-radius:2px}
.sp-row.no .sp-ic{border-color:#ddc7c7;color:#b28b8b}
.sp-row.no .sp-ic::before,.sp-row.no .sp-ic::after{display:block;left:4px;top:7.2px;width:8px;height:1.7px;background:currentColor;border-radius:2px}
.sp-row.no .sp-ic::before{transform:rotate(45deg)}
.sp-row.no .sp-ic::after{transform:rotate(-45deg)}
.sp-row.run .sp-ic{border-color:#dedad2;border-top-color:var(--acc);animation:spin .7s linear infinite}
.srcpop .sp-f{display:flex;align-items:center;gap:8px;margin-top:5px;padding:8px 4px 1px;border-top:1px solid var(--line)}
.srcpop .sp-b{
  flex:none;height:26px;padding:0 10px;border-radius:5px;
  border:1px solid var(--line2);background:var(--card);
  font-size:12px;color:var(--ink2);transition:background .15s,color .15s,border-color .15s;
}
.srcpop .sp-b:hover{background:#f0eee9;color:var(--ink);border-color:#b9b5ab}
.srcpop .sp-b[disabled]{opacity:.5;cursor:default;background:var(--card);color:var(--ink3);border-color:var(--line2)}
.srcpop .sp-t{flex:1;min-width:0;font-size:11px;line-height:1.4;color:var(--ink3);text-align:right}

/* ============ 提示条 ============ */
#statusModal{
  position:fixed;left:0;right:0;top:64px;z-index:1200;
  display:flex;justify-content:center;padding:0 16px;
  pointer-events:none;opacity:0;transform:translateY(-8px) scale(.96);
  transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1);
}
#statusModal.show{opacity:1;transform:none}
#statusModal .sm-box{
  display:flex;align-items:center;gap:8px;max-width:100%;
  padding:8px 14px;border-radius:6px;
  background:var(--card);border:1px solid var(--line2);
  box-shadow:0 6px 20px rgba(26,27,29,.1);
  color:var(--ink);
}
#statusModal.load .sm-box{border-color:#c6c2b8}
#statusModal.ok .sm-box{color:var(--ok);border-color:#bcd8c7}
#statusModal.fail .sm-box{color:var(--bad);border-color:#e2c4c4}
#statusModal.tip .sm-box{color:var(--acc2);border-color:#e4cbbc}
.sm-icon{width:15px;height:15px;flex:none}
.sm-icon svg{width:100%;height:100%;display:block}
.sm-icon .c{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.9}
.sm-icon .m{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
#statusModal.load .sm-icon .m{stroke-dasharray:12 27;animation:spin .8s linear infinite}
.sm-title{font-size:13px;font-weight:500;white-space:nowrap}
.sm-sub{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 加载中的小横条：不玩扫光，就一截实心条安静地呼吸 */
#statusModal .sm-box .sm-bar{display:none}
#statusModal.load .sm-box .sm-bar{display:block;width:30px;height:2px;background:#e6e3dc;border-radius:2px;flex:none;overflow:hidden}
.sm-bar i{display:block;height:100%;width:100%;background:var(--acc);animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}

/* ============ 动效 ============ */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:130% 0}to{background-position:-30% 0}}
.nav{animation:drop .45s cubic-bezier(.2,.8,.2,1) both}
.hero h1{animation:rise .5s .06s cubic-bezier(.2,.8,.2,1) both}
.search{animation:rise .5s .2s cubic-bezier(.2,.8,.2,1) both}
.results{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
.res-hd .all{transition:color .15s,transform .15s}
.res-hd .all:hover{transform:translateX(1px)}
.search svg.mag{transition:color .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.search:focus-within svg.mag{transform:scale(1.12) rotate(-8deg)}
.cov-mask,.cov .cov-mask svg{transition:opacity .15s,transform .2s}
.cov:hover .cov-mask svg{transform:scale(1.1)}
.btn,.search .go,.ic,.sp-b{transition:background .15s,border-color .15s,color .15s,transform .12s}
.mask.on .panel{animation:popArt .34s cubic-bezier(.2,.9,.3,1.12) both}
.mask.on .profile,.mask.on .pv{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
.mask.on .pv:nth-child(1){animation-delay:.05s}
.mask.on .pv:nth-child(2){animation-delay:.1s}
.mask.on .pv:nth-child(3){animation-delay:.15s}
.mask.on .pv:nth-child(4){animation-delay:.2s}
.mask.on .pv:nth-child(5){animation-delay:.25s}
.queue.on li{animation:rise .28s cubic-bezier(.2,.8,.2,1) both}

/* ============ 自适应 ============ */
@media (max-width:720px){
  .lyr-main{padding:6px 20px}
  .lyr-lrc{width:100%}
  .lyr .lyr-foot{padding:0 20px 18px}
  .lyr .lyr-bar{gap:8px}
  .lyr .lyr-tools,.lyr .lyr-time{width:64px}
  .lyr .ic-mode{padding:0 9px 0 8px;gap:6px}
  .lyr .ic-mode .tx{display:none}
  .queue{right:12px;bottom:calc(var(--player-h) + 24px)}
  .srcpop{right:12px}
}
@media (max-width:520px){
  .wrap{padding:0 14px}
  .nav{padding:0 max(14px,env(safe-area-inset-left))}
  .brand .nm{font-size:14px}
  .src-tag{padding:3px 7px}
  .src-tag .ct{display:none}
  .p-row{gap:10px;padding:0 12px;grid-template-columns:1fr auto 1fr}
  .p-info{gap:10px}
  .p-time{display:none}
  .cov{width:46px;height:46px}
  .p-now .t .by{max-width:38%}
  .p-ctrl{gap:4px}
  .ic{width:36px;height:36px}
  .ic-play{width:42px;height:42px}
  .ic-skip::before{width:2.2px;height:14px;margin-top:-7px}
  .ic-skip::after{width:11px;height:14px;margin-top:-7px}
  .ic-prev::before{left:7.6px}
  .ic-prev::after{left:11.8px}
  .ic-next::before{right:7.6px}
  .ic-next::after{right:11.8px}
  .songlist li{padding:9px 12px;gap:10px}
  .res-hd{padding:11px 12px}
  .hero{padding:28px 0 18px}
  .hero h1{font-size:20px}
}
@media (max-height:520px) and (orientation:landscape){
  :root{--player-h:74px}
  .lyr-main{align-items:center;padding:0 24px}
  .lyr-lrc{height:100%}
  .lyr .lyr-foot{padding:0 24px 12px}
  .cov{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
/* =========================================================
   MATERIAL / PIXEL SKIN
   ------------------------------------------------------------
   照 Material 3 的组件规格写，不另发明一套"设计语言"：
     · 圆角只用 --r-* 刻度：容器 12/16/28，图标按钮正圆
     · 尺寸按 M3：搜索条 56、按钮 40、图标按钮 40/52、列表行 64
     · 层级靠色调（surface-2 / surface-3），阴影只用 --e2/--e3
     · 强调色只有 primary 一个，状态色只出现在状态本身上
   不出现：渐变文字、毛玻璃、发光、emoji、超大圆角气泡。
   ========================================================= */

/* —— 顶栏：M3 small top app bar —— */
.nav{height:64px;background:var(--surface);border-bottom:0;transition:background .2s}
.brand .logo{background:var(--primary);color:var(--on-primary);border-radius:var(--r-full)}
.brand .nm{font-size:15px;font-weight:500;letter-spacing:0}
.btn{
  height:40px;padding:0 20px;border:0;border-radius:var(--r-full);
  background:var(--primary-box);color:var(--acc2);font-size:14px;font-weight:500;box-shadow:none;
}
.btn:hover{background:#c2dafb;box-shadow:none}
.btn:active{background:var(--primary);color:var(--on-primary)}
.btn .av{border-radius:var(--r-full);background:var(--primary);color:var(--on-primary)}

/* —— 搜索：M3 docked search bar（56 高 / 28 圆角 / 无描边）—— */
.search{
  height:56px;margin-top:20px;padding:0 8px 0 16px;
  background:var(--surface-2);border:0;border-radius:var(--r-xl);box-shadow:none;
  transition:background .2s,box-shadow .2s;
}
.search:hover{background:#e7e9f7}
.search:focus-within{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--primary)}
.search svg.mag{width:22px;height:22px;color:var(--on-surface-2)}
.search input{font-size:16px}
.search .go{
  height:40px;padding:0 22px;border:0;border-radius:var(--r-full);
  background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:500;box-shadow:none;
}
.search .go:hover{background:#0842a0;box-shadow:none}
.search .go:active{background:#06337c;box-shadow:none}
.search .go[disabled]{background:var(--surface-3);color:var(--on-surface-3);box-shadow:none;cursor:default}

/* —— 结果卡：filled card（16 圆角、无描边、无投影）—— */
.results{border:0;border-radius:var(--r-lg);background:var(--surface-2);box-shadow:none;overflow:hidden}
.res-hd{border-bottom:0;padding:14px 16px 10px}
.res-hd h2{font-size:14px;font-weight:500;letter-spacing:0}
.res-hd .all{padding:6px 12px;border-radius:var(--r-full);color:var(--primary);font-weight:500;transition:background .15s}
.res-hd .all:hover{background:var(--primary-box);text-decoration:none}
.res-hd .all[disabled]{background:none}
.songlist li{border-bottom:0;padding:10px 16px;min-height:64px}
.songlist li:hover{background:rgba(11,87,208,.06)}
.songlist li.cur{background:var(--primary-box)}
.songlist li.cur::before{display:none}
.songlist .im{border:0;border-radius:var(--r-full);background:var(--surface-3)}
.songlist .im .eq{background:rgba(20,20,26,.5)}
.songlist .im .eq i{width:2px;border-radius:1px;background:#fff}
.songlist li.cur .meta .t{color:var(--acc2);font-weight:500}
.songlist .idx{font-family:var(--mono);font-size:12px}
.songlist .empty{padding:44px 16px;font-size:14px}
.songlist li.sk .si{border-radius:var(--r-full);background:#dcdeea}
.songlist li.sk .sl i{border-radius:var(--r-xs)}
.songlist li.sk .sl i,.songlist li.sk .si{
  background:linear-gradient(90deg,#dcdeea 26%,#edeef7 44%,#dcdeea 62%);
  background-size:280% 100%;animation:shimmer 1.4s linear infinite;
}

/* —— 底部播放条：浮起的 media card（12 边距 / 28 圆角 / level2）—— */
.player{
  background:transparent;border-top:0;box-shadow:none;
  padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none;
}
.player .prog,.player .p-row{background:var(--surface-d);pointer-events:auto}
.player .prog{height:4px;border-radius:var(--r-xl) var(--r-xl) 0 0;background:#3a3a44;overflow:hidden}
.player .prog:hover{height:4px}
.player .prog .fill{background:var(--primary-2);transition:width .1s linear}
.player .prog .knob{display:none}
.player .p-row{
  position:relative;height:calc(var(--player-h) - 4px);padding:0 12px;
  border-radius:0 0 var(--r-xl) var(--r-xl);box-shadow:var(--e2);
}
/* 顶盖：把进度条那一截和下面的内容连成一张卡 */
.player .p-row::before{
  content:"";position:absolute;left:0;right:0;top:-8px;height:9px;
  background:var(--surface-d);border-radius:var(--r-xl) var(--r-xl) 0 0;
}
.cov{border:0;border-radius:var(--r-sm);background:var(--surface-d2)}
.cov .cov-mask{background:rgba(0,0,0,.5);border-radius:var(--r-sm)}
.cov.busy .cov-mask::before{border-color:rgba(228,226,233,.28);border-top-color:var(--primary-2)}
.cov.live::after{border-radius:var(--r-sm);box-shadow:inset 0 0 0 2px rgba(168,199,255,.34)}
.p-now .t .tt{font-size:14px;font-weight:500}
.p-now .ml{color:var(--di2);font-size:12px}
.p-now .ml .eq i{width:2px;border-radius:1px;background:var(--primary-2)}
.p-time{color:var(--di2)}
/* 图标按钮：M3 icon button（圆形 state layer，不描边） */
.ic{border-radius:var(--r-full);color:var(--di2)}
.ic:hover{background:rgba(228,226,233,.1);box-shadow:none;color:var(--di)}
.ic:active{background:rgba(228,226,233,.16);box-shadow:none}
.ic-play{width:52px;height:52px;background:var(--primary-2);color:#12325f;border-radius:var(--r-full);box-shadow:none}
.ic-play svg{width:24px;height:24px}
.ic-play:hover{background:#c2dafb;color:#0d2a53;box-shadow:none}
.ic-play:active{background:#a8c7ff;box-shadow:none}
/* 上/下一首：保持纯 CSS 画的竖条 + 三角，只把比例调到 Material 的 stroke */
.ic-skip::before,.ic-skip::after{height:16px;margin-top:-8px;border-radius:1px}
.ic-skip::before{width:2.5px;background:var(--di)}
.ic-skip::after{width:12px;background:var(--di)}
.ic-prev::before{left:9px}
.ic-prev::after{left:13.5px;clip-path:polygon(100% 0,0 50%,100% 100%)}
.ic-next::before{right:9px}
.ic-next::after{right:13.5px;clip-path:polygon(0 0,100% 50%,0 100%)}
.ic-prev:hover::before,.ic-prev:hover::after{transform:none}
.ic-next:hover::before,.ic-next:hover::after{transform:none}

/* —— 歌词页：深色面 + 封面压暗做底（不糊，糊了像毛玻璃）—— */
.lyr{background:var(--surface-d)}
.lyr .bg{filter:brightness(.3) saturate(1.1);opacity:.55;animation:kb 40s ease-in-out infinite alternate}
.lyr .veil{background:linear-gradient(180deg,rgba(20,20,24,.72),rgba(20,20,24,.88))}
.lyr .lyr-x{border-radius:var(--r-full);color:var(--di2)}
.lyr .lyr-x:hover{background:rgba(228,226,233,.12);color:var(--di)}
.lyr .lyr-top b{font-size:15px;font-weight:500}
.l-line{padding:9px 6px;font-size:15.5px;line-height:1.74;color:#8e9099}
.l-line:hover{color:#c3c5cd}
.l-line.acti{font-size:24px;font-weight:700;letter-spacing:.015em}
.lrc-none{color:var(--di2);text-align:center}
.lyr .lyr-prog{height:4px;border-radius:var(--r-full);background:#3a3a44}
.lyr .lyr-prog .fill{background:var(--primary-2)}
.lyr .lyr-prog .knob{display:none}
/* 播放方式：M3 outlined button + 纯 CSS 图标 */
.lyr .ic-mode{
  height:40px;padding:0 16px 0 14px;gap:8px;border-radius:var(--r-full);
  background:transparent;border:1px solid #4a4a55;color:var(--di2);
  font-size:14px;font-weight:500;box-shadow:none;
}
.lyr .ic-mode:hover{background:rgba(228,226,233,.1);border-color:#6a6a78;color:var(--di)}
.lyr .ic-mode:active{background:rgba(228,226,233,.16)}
.lyr .ic-mode.on{color:var(--primary-2);border-color:var(--primary-2);background:rgba(168,199,255,.1)}
.lyr .ic-mode .mi{width:18px;height:18px}

/* —— 播放列表浮层：M3 menu surface —— */
.queue{background:#26262e;border:0;border-radius:var(--r-md);box-shadow:var(--e3)}
.queue .qh{border-bottom:0;padding:14px 16px 10px;font-size:14px;font-weight:500;color:var(--di)}
.queue li{border-bottom:0;padding:10px 16px}
.queue li:hover{background:rgba(228,226,233,.09)}
.queue li.cur{background:rgba(168,199,255,.16)}
.queue li.cur .t{color:var(--primary-2);font-weight:500}
.queue .qh .x{border-radius:var(--r-full)}
.queue .qh .x:hover{background:rgba(228,226,233,.1);color:var(--di)}

/* —— 我的音乐：收听记录 / 自建歌单（卡片） ——
   沿用同一套 M3 token：容器 surface-2、圆角只走 --r-*、无渐变无玻璃无发光。 */
.mine{margin:0 0 20px;border:0;border-radius:var(--r-lg);background:var(--surface-2);padding:14px 16px 18px}
.mine .res-hd{padding:0 0 12px;border-bottom:0}
.mtabs{display:flex;gap:4px;margin-left:auto}
.mtabs .tab{
  height:32px;padding:0 14px;border-radius:var(--r-full);
  font-size:13px;font-weight:500;color:var(--on-surface-2);
  transition:background .15s,color .15s;
}
.mtabs .tab:hover{background:rgba(11,87,208,.08)}
.mtabs .tab.on{background:var(--primary-box);color:var(--primary)}

/* 收听记录：横向小卡片，两列自适应 */
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.mcard{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px;border-radius:var(--r-md);
  transition:background .15s;
}
.mcard:hover{background:rgba(11,87,208,.08)}
.mcard .mc-cov{position:relative;flex:none;width:44px;height:44px;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-3)}
.mcard .mc-cov img{width:100%;height:100%;object-fit:cover}
.mcard .mc-txt{flex:1;min-width:0}
.mcard .mc-t{display:block;font-size:13.5px;color:var(--on-surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mc-s{display:block;margin-top:1px;font-size:12px;color:var(--on-surface-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.cur .mc-t{color:var(--primary);font-weight:500}
.mcard .mc-x{
  position:relative;flex:none;width:24px;height:24px;border-radius:var(--r-full);
  color:var(--on-surface-3);opacity:0;transition:opacity .15s,background .15s,color .15s;
}
.mcard:hover .mc-x{opacity:1}
.mcard .mc-x:hover{background:rgba(11,87,208,.12);color:var(--on-surface)}
.mcard .mc-x::before,.mcard .mc-x::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.6px;background:currentColor;border-radius:2px}
.mcard .mc-x::before{transform:translate(-50%,-50%) rotate(45deg)}
.mcard .mc-x::after{transform:translate(-50%,-50%) rotate(-45deg)}

/* 歌单：封面主导的方卡 */
.pladd{display:flex;gap:8px;margin:0 0 10px}
.pladd input{
  flex:1;min-width:0;height:40px;padding:0 14px;
  border:0;border-radius:var(--r-full);background:var(--surface);color:var(--on-surface);
}
.pladd input::placeholder{color:var(--on-surface-3)}
.pladd .go{
  flex:none;height:40px;padding:0 20px;border-radius:var(--r-full);
  background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:500;
  transition:background .15s;
}
.pladd .go:hover{background:var(--on-surface)}
.pladd .go[disabled]{background:var(--surface-3);color:var(--on-surface-3);cursor:default}
.mnote{margin:0 0 12px;font-size:12px;line-height:1.6;color:var(--on-surface-3)}
.mnote code{font-family:var(--mono);font-size:11.5px}
.plcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.plcard{position:relative;display:block;width:100%;text-align:left;border-radius:var(--r-md);overflow:hidden;transition:background .15s}
.plcard:hover{background:rgba(11,87,208,.08)}
.plcard .pl-cov{position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-3)}
.plcard .pl-cov img{width:100%;height:100%;object-fit:cover}
.plcard .pl-cov .pl-n{
  position:absolute;right:6px;bottom:6px;padding:2px 8px;border-radius:var(--r-full);
  background:rgba(27,27,33,.72);color:#fff;font-size:11px;line-height:1.6;
}
.plcard .pl-t{display:block;margin-top:8px;font-size:13.5px;color:var(--on-surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plcard .pl-s{display:block;margin-top:1px;font-size:12px;color:var(--on-surface-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plcard .pl-x{
  position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:var(--r-full);
  background:rgba(27,27,33,.62);color:#fff;opacity:0;transition:opacity .15s,background .15s;
}
.plcard:hover .pl-x{opacity:1}
.plcard .pl-x:hover{background:var(--bad)}
.plcard .pl-x::before,.plcard .pl-x::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.6px;background:currentColor;border-radius:2px}
.plcard .pl-x::before{transform:translate(-50%,-50%) rotate(45deg)}
.plcard .pl-x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.mempty{margin:0;padding:18px 0 6px;text-align:center;font-size:13px;color:var(--on-surface-3)}

@media (max-width:520px){
  .mine{padding:12px 12px 16px}
  .mine .res-hd{flex-wrap:wrap;gap:8px}
  .mtabs{margin-left:0;width:100%}
  .mcards{grid-template-columns:1fr}
  .plcards{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .pladd{flex-wrap:wrap}
  .pladd input{height:40px}
}

/* —— 登录面板 / 状态条 / 音源面板 —— */
.panel{border:0;border-radius:var(--r-xl);background:var(--surface-2);box-shadow:var(--e3)}
.panel .ph{padding:20px 24px 12px;border-bottom:0;font-size:20px;font-weight:500}
.panel .ph .x{border-radius:var(--r-full);color:var(--on-surface-2)}
.panel .ph .x:hover{background:rgba(11,87,208,.08);color:var(--on-surface)}
.panel .pd{padding:8px 12px 16px}
.pv{border-radius:var(--r-full);padding:10px 16px}
.pv:hover{background:rgba(11,87,208,.08)}
.pv .lg{border-radius:var(--r-sm);font-size:11px}
.profile{border-radius:var(--r-lg);margin:6px 0 0;padding:12px 16px}
.profile:hover{background:rgba(11,87,208,.08)}
.profile .av{border-radius:var(--r-full);background:var(--primary);color:var(--on-primary)}
#statusModal .sm-box{border:0;border-radius:var(--r-xs);background:#33333a;color:#e4e2e9;box-shadow:var(--e2)}
#statusModal .sm-icon{color:#a8c7ff}
#statusModal.ok .sm-box{color:#a8d5b5}
#statusModal.fail .sm-box{color:#f2b8b5}
#statusModal.tip .sm-box{color:#a8c7ff}
#statusModal.load .sm-box{color:#c5c6d0}
#statusModal .sm-box .sm-bar{background:#55555f;border-radius:var(--r-full)}
.sm-bar i{background:#a8c7ff}
.srcpop{border:0;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--e3);padding:12px}
.srcpop .sp-h{padding:0 0 8px;font-size:13px;font-weight:500;border-bottom:0}
.srcpop .sp-x{border-radius:var(--r-full)}
.srcpop .sp-x:hover{background:rgba(11,87,208,.08);color:var(--on-surface)}
.srcpop ul{padding-top:0}
.sp-row{border-radius:var(--r-full);padding:8px 10px}
.sp-row:hover{background:rgba(11,87,208,.08)}
.sp-row.cur{background:var(--primary-box)}
.sp-row .sp-ic{border-radius:var(--r-full)}
.srcpop .sp-f{margin-top:10px;padding-top:10px;border-top:1px solid var(--outline-2)}
.srcpop .sp-b{height:40px;padding:0 18px;border-radius:var(--r-full);background:var(--primary-box);color:var(--acc2)}
.srcpop .sp-b:hover{background:#c2dafb}

</style>

</head>
<body>

<header class="nav">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l10-2v12a3 3 0 1 1-2-2.83V8.6l-6 1.2V18a3 3 0 1 1-2-2.83z"/></svg></span>
    <span class="nm">次元星域音乐</span>
  </div>
  <div class="nav-right">
    <button class="src-tag" id="srcTag" title="当前音源" aria-haspopup="true" aria-expanded="false">
      <span class="nm" id="srcCur">网易云</span><span class="ct" id="srcNum">·</span><i class="cv"></i>
    </button>
    <button class="btn" id="btnLogin">登录</button>
  </div>
  <!-- 音源检测面板：逐个平台实测「搜得到 / 播得出」 -->
  <div class="srcpop" id="srcPop">
    <div class="sp-h">音源检测<span class="n" id="srcCount">未检测</span>
      <button class="sp-x" id="btnSrcClose" aria-label="关闭"></button>
    </div>
    <ul id="srcList"></ul>
    <div class="sp-f">
      <button class="sp-b" id="btnSrcScan">重新检测</button>
      <span class="sp-t" id="srcTip"></span>
    </div>
  </div>
</header>

<main class="wrap" style="padding-bottom:calc(var(--player-h) + 32px)">
  <section class="hero" id="radioHero">
    <div class="hero-t">
      <h1>找首歌听听</h1>
      <div class="hero-k" id="heroSrc">正在检测可用音源…</div>
    </div>
    <form class="search" id="searchForm" autocomplete="off">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="kw" enterkeyhint="search" aria-label="搜索歌曲">
      <button class="go" type="submit" id="btnDoSearch">搜索</button>
    </form>
  </section>

  <section class="results" id="listCard" hidden>
    <div class="res-hd">
      <h2>搜索结果</h2>
      <span class="n" id="resCount"></span>
      <button class="all" id="playAll"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>播放全部</button>
    </div>
    <ul class="songlist" id="searchList"></ul>
  </section>

  <!-- 我的音乐：收听记录 + 自建歌单。
       能力边界见 README：OAuth 只回 name/email/avatar，跟音乐平台账号无关，
       meting API 也没有「按用户列歌单」的接口（type=user 直接 400），
       所以歌单靠手动导入 ID / 链接，记录存在本机 localStorage。 -->
  <section class="mine" id="mineCard" hidden>
    <div class="res-hd">
      <h2>我的音乐</h2>
      <div class="mtabs" role="tablist">
        <button class="tab on" id="tabHist" data-pane="paneHist" role="tab" aria-selected="true">收听记录</button>
        <button class="tab" id="tabPls" data-pane="panePls" role="tab" aria-selected="false">我的歌单</button>
      </div>
    </div>

    <div class="mpane" id="paneHist" role="tabpanel">
      <div class="mcards" id="histCards"></div>
      <p class="mempty" id="histEmpty">还没有收听记录，搜首歌听听就有了</p>
    </div>

    <div class="mpane" id="panePls" role="tabpanel" hidden>
      <form class="pladd" id="plForm" autocomplete="off">
        <input id="plId" placeholder="粘贴歌单链接或 ID，例如 3778678" enterkeyhint="done" aria-label="歌单链接或 ID">
        <button class="go" type="submit" id="btnPlAdd">导入</button>
      </form>
      <p class="mnote">meting 没有「按账号列歌单」的接口（<code>type=user</code> 直接 400），OAuth 身份也和网易云账号无关，所以歌单只能手动导入。<code>type=playlist</code> 也只回一串歌曲、连歌单名都没有，标题只能拿 ID 顶着。</p>
      <div class="plcards" id="plCards"></div>
      <p class="mempty" id="plEmpty">还没有导入歌单</p>
    </div>
  </section>
</main>

<footer class="player">
  <div class="prog" id="prog" role="slider" aria-label="播放进度"><div class="fill" id="progFill"></div><div class="knob"></div></div>
  <div class="p-row">
    <div class="p-info">
      <button class="cov" id="coverBtn" aria-label="打开歌词">
        <img id="coverImg" src="https://t.alcy.cc/tx" alt="" decoding="async" fetchpriority="high">
        <span class="cov-mask"><svg id="coverMask" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
      </button>
      <div class="p-now" id="nowBtn" title="点击查看歌词">
        <div class="t"><span class="tt" id="nowTitle">未在播放</span><span class="by" id="nowBy"></span></div>
        <div class="ml idle" id="nowLrc">
          <span class="eq"><i></i><i></i><i></i></span>
          <span class="c" id="nowLrcC"></span>
          <span class="tr" id="nowLrcT"></span>
        </div>
      </div>
    </div>
    <div class="p-ctrl">
      <button class="ic ic-skip ic-prev" id="btnPrev" title="上一首" aria-label="上一首"></button>
      <button class="ic ic-play" id="btnPlay" title="播放" aria-label="播放"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ic ic-skip ic-next" id="btnNext" title="下一首" aria-label="下一首"></button>
    </div>
    <div class="p-time"><span id="curTime">00:00</span><span class="sep">/</span><span id="durTime">00:00</span></div>
  </div>
</footer>

<!-- 歌词页：左图右词 -->
<div class="lyr" id="lyrView">
  <div class="bg" id="lyrBg"></div>
  <div class="veil"></div>
  <div class="lyr-top">
    <div class="tt"><b id="lyrTitle"></b><span id="lyrAuthor"></span></div>
    <button class="lyr-x" id="btnLyrClose" aria-label="收起歌词"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div class="lyr-main">

<script>
(function () {
"use strict";

/* 次元星域音乐 —— 仅搜索 / 登录 / 歌词 / 播放 */

var S = {
  server: "netease", list: [], idx: -1, lrc: [], lrcIdx: -1, mode: 0,
  tk: 0, cands: null, ci: 0, same: 0, tried: null, switching: false,
  retryT: 0, watchT: 0, watching: false, pausedByUser: false, failAt: 0,
  /* 主页歌词行：mode = live（正在放歌词）/ hint（加载、换源、失败提示）/ idle（占位） */
  mini: "idle", miniIdx: -1, srvRetry: ""
};
var audio = document.getElementById("audio");
var DEFAULT_ART = "https://t.alcy.cc/tx";

/* ---------- 接口地址 ----------
   默认全部走同源 Worker 路由：上游密钥（HMAC）、多站点兜底链都在 Worker 侧，
   直连上游既算不出签名，也会把「Worker 出口被 CDN 屏蔽」的问题原样带过来。
   只有页面被非 Worker 环境直接打开（本地双击 index.html）时，同源路由不可用，
   才会自动退回上游直连。 */
var UPSTREAM = "https://api.107211.xyz/api";
var toUpstream = false;
var HEALTH = {};   /* /health 的结论，只在「所有音源都失败」后查一次，用于事后解释原因 */
function qs(server, type, id, r) {
  return "server=" + encodeURIComponent(server || S.server) +
         "&type=" + encodeURIComponent(type) +
         "&id=" + encodeURIComponent(id) +
         (r ? "&r=" + encodeURIComponent(r) : "");
}
function apiUrl(type, id, server, r) { return "/api?" + qs(server, type, id, r); }
function upUrl(type, id, server, r) { return UPSTREAM + "?" + qs(server, type, id, r); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* 带超时的请求。url 可以是字符串，也可以是「同源/上游二选一」的 Promise */
function fetchUrl(urlP, ms) {
  return Promise.resolve(urlP).then(function (u) {
    var ctrl = null, timer = 0;
    try {
      if (typeof AbortController === "function") {
        ctrl = new AbortController();
        timer = setTimeout(function () { ctrl.abort(); }, ms || 8000);
      }
    } catch (e) { ctrl = null; }
    return fetch(u, ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error("http " + r.status);
      return r;
    }, function (e) {
      if (timer) clearTimeout(timer);
      throw e;
    });
  });
}
/* 同源优先；同源请求失败就改走上游再试一次（两次都失败才认定这条路不通） */
function route(sameUrl, upstreamUrl, ms) {
  if (toUpstream) return fetchUrl(upstreamUrl, ms);
  return fetchUrl(sameUrl, ms).catch(function () {
    toUpstream = true;
    return fetchUrl(upstreamUrl, ms).catch(function (e) { toUpstream = false; throw e; });
  });
}
/* JSON 类接口的容忍度高一些：上游冷启动实测能到 6 秒多，
   用 8 秒的默认超时去卡搜索，会在网络稍差时把好端端的搜索判成失败 */
var JSON_TIMEOUT = 12000;
function apiJSON(type, id, server, r, tries) {
  tries = (tries == null) ? 1 : tries;
  return route(apiUrl(type, id, server, r), upUrl(type, id, server, r), JSON_TIMEOUT)
    .then(function (res) { return res.json(); })
    .catch(function (e) {
      if (tries > 0) return wait(400).then(function () { return apiJSON(type, id, server, r, tries - 1); });
      throw e;
    });
}
function coverUrl(id, server) {
  return toUpstream ? upUrl("pic", id, server) : ("/cover?" + qs(server, "pic", id));
}
function lrcUrl(id, server) {
  return toUpstream ? upUrl("lrc", id, server) : ("/lyric?" + qs(server, "lrc", id));
}

/* ---------- 播放地址解析 ----------
   上游 type=url / type=pic 本身不是音频/图片，而是 302 跳到 music.126.net 的 CDN。
   老实现的两个致命问题：
     1) 把 /api?type=url 直接塞给 audio.src —— 那是 JSON（或 Worker 回源后的 525 文本页），
        永远不可能出声；
     2) Worker 服务端跟随这个 302 去 CDN 取流，网易云 CDN 屏蔽 Cloudflare 出口段，
        必然 525（2026-09 线上实测：/api、/lyric 全好，音频与封面确定性挂）。
   现在的做法：让 Worker 用 redirect:"manual" 只解出地址（它手上有密钥与兜底链），
   浏览器再直连 CDN 取流。既绕开 525，进度条的 Range 拖动也照常可用。 */
var NOT_AUDIO = /#\/song|\/discover|\.html?($|\?)/i;
function toHttps(u) { return String(u || "").trim().replace(/^http:\/\//i, "https://"); }
function audioUrlFrom(o, depth) {
  depth = depth || 0;
  if (depth > 4 || o == null) return "";
  if (typeof o === "string") {
    var s = toHttps(o);
    return /^https?:\/\//i.test(s) && !NOT_AUDIO.test(s) ? s : "";
  }
  if (Array.isArray(o)) {
    for (var i = 0; i < o.length; i++) { var a = audioUrlFrom(o[i], depth + 1); if (a) return a; }
    return "";
  }
  if (typeof o === "object") {
    var keys = ["url", "audio", "src", "link", "songurl", "data", "song", "lrc"];
    for (var k = 0; k < keys.length; k++) {
      if (o[keys[k]] != null) { var u = audioUrlFrom(o[keys[k]], depth + 1); if (u) return u; }
    }
    for (var j in o) {
      if (!Object.prototype.hasOwnProperty.call(o, j)) continue;
      var v = audioUrlFrom(o[j], depth + 1);
      if (v) return v;
    }
  }
  return "";
}
/* 上游 302 直跳 CDN 时，浏览器自己跟完，res.url 就是可播地址；其余按 JSON 解析 */
function pickFromRes(res) {
  var ct = (res.headers.get("content-type") || "").toLowerCase();
  if (ct.indexOf("audio/") === 0 || ct.indexOf("video/") === 0 || ct.indexOf("octet-stream") >= 0) {
    try { if (res.body) res.body.cancel(); } catch (e) {}
    return /^https?:/i.test(res.url) ? res.url : "";
  }
  return res.json().then(function (j) { return audioUrlFrom(j); }, function () { return ""; });
}
/* 解析这首歌的可播地址。逐级降级：Worker /resolve → 上游直连 → 搜索结果自带直链。
   三条都空才回调空串，由重试/换源逻辑接手。 */
function resolveAudio(c, cb) {
  var t = S.tk;
  if (c.sr) { cb(c.sr); return; }
  var q = qs(c.s, "url", c.id, String(Date.now() % 1000000));
  var steps = [
    function () { return fetchUrl("/resolve?" + q, 6000).then(pickFromRes); },
    function () { return fetchUrl(UPSTREAM + "?" + q, 6000).then(pickFromRes); }
  ];
  var i = 0;
  (function next() {
    if (!isLive(t)) return;
    if (i >= steps.length) { cb(audioUrlFrom(c.au)); return; }
    var p;
    try { p = steps[i++](); } catch (e) { return next(); }
    p.then(function (u) {
      if (!isLive(t)) return;
      if (u) { c.sr = u; cb(u); } else next();
    }, function () { next(); });
  })();
}

function $(id) { return document.getElementById(id); }
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return ("0" + Math.floor(sec / 60)).slice(-2) + ":" + ("0" + (sec % 60)).slice(-2);
}
function picToHttps(p) { return toHttps(p); }
function idFromUrl(u) {
  var s = String(u || "");
  /* 必须卡住 ?id= / &id= 边界：albumid=99、picid=... 里面也含 "id="，
     用 indexOf 会把 albumid 的值当歌曲 id 取出来，换源后就会播成别的歌 */
  var m = s.match(/[?&]id=([^&#]*)/);
  if (!m) return "";
  try { return decodeURIComponent(m[1] || ""); } catch (e) { return m[1] || ""; }
}
function mapItem(raw, i, server) {
  raw = raw || {};
  var id = raw.id ? String(raw.id) : "";
  if (!id) id = idFromUrl(raw.url || raw.lrc || raw.pic);
  /* 取不到真实 id 就不再伪造 "t"+hash：伪 id 请求 /api、/lyric、/cover 必然失败，
     界面上却显示成一条能播、点了没反应的歌。宁可在结果里滤掉。 */
  return {
    id: id,
    server: raw.server || server || S.server,
    title: String(raw.title || raw.name || raw.song || ""),
    author: String(raw.author || raw.artist || raw.singer || ""),
    pic: picToHttps(raw.pic || raw.cover || raw.picUrl || ""),
    au: String(raw.url || raw.auc || raw.audio || "")
  };
}
/* 至少要有真实 id 或直链音频才 playable */
function usable(it) { return !!(it.id || it.au); }
function toList(data, server) {
  var arr = Array.isArray(data) ? data : ((data && data.data) || []);
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var it = mapItem(arr[i], i, server);
    if (usable(it)) out.push(it);
  }
  return out;
}
function getJSON(url, tries) {
  tries = (tries == null) ? 1 : tries;
  var ctrl = new AbortController();
  var timer = window.setTimeout(function () { ctrl.abort(); }, 6000);
  return fetch(url, { signal: ctrl.signal }).then(function (r) {
    window.clearTimeout(timer);
    return r.json();
  }).catch(function (err) {
    window.clearTimeout(timer);
    if (tries > 0) {
      return new Promise(function (res) { setTimeout(res, 400); }).then(function () { return getJSON(url, tries - 1); });
    }
    throw err;
  });
}
function escText(s) {
  return String(s == null ? "" : s).replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escAttr(s) { return escText(s).replace(/"/g, "&quot;"); }
function imgFallback(img) {
  img.onerror = function () { this.onerror = null; this.src = DEFAULT_ART; };
}

/* ---------- 搜索（输入即搜，结果栏随搜索显隐） ---------- */
var searchTimer = null;
var SEARCH_CACHE = {};
/* 搜索中的骨架屏 */
function renderSkeleton(ul, n) {
  var h = "";
  for (var i = 0; i < n; i++) {
    h += '<li class="sk"><span class="si"></span><span class="sl"><i></i><i></i></span></li>';
  }
  ul.innerHTML = h;
}
function runSearch() {
  var q = $("kw").value.trim();
  $("radioHero").classList.toggle("searching", q.length > 0);
  var card = $("listCard");
  if (!q) { card.hidden = true; $("btnDoSearch").disabled = false; return; }
  card.hidden = false;
  var ul = $("searchList");
  var go = $("btnDoSearch");
  var got = SEARCH_CACHE[q];
  if (got && got.expire > Date.now()) {
    S.list = got.list.slice();
    S.idx = -1;
    $("resCount").textContent = got.list.length ? got.list.length + " 首" : "";
    renderSonglist(ul, S.list);
    go.disabled = false;
  } else {
    renderSkeleton(ul, 5);
    $("resCount").textContent = "";
    go.disabled = true;
  }
  apiJSON("search", q, S.server, 0, 1).then(function (data) {
    var list = toList(data);
    var keys = Object.keys(SEARCH_CACHE);
    if (keys.length >= 20) delete SEARCH_CACHE[keys[0]];
    SEARCH_CACHE[q] = { list: list.slice(), expire: Date.now() + 5 * 60 * 1000 };
    if ($("kw").value.trim() !== q) return;
    S.list = list;
    S.idx = -1;
    $("resCount").textContent = list.length ? list.length + " 首" : "";
    renderSonglist(ul, list);
  }).catch(function () {
    if ($("kw").value.trim() !== q) return;
    /* 手动指定的音源搜不动时自动退回默认源再试一次，
       别让人对着一个死源反复点重试 */
    if (S.server !== "netease" && S.srvRetry !== q) {
      S.srvRetry = q;
      S.server = "netease";
      try { localStorage.setItem(SRV_STORE, "netease"); } catch (e) {}
      SEARCH_CACHE = {};
      setSrcTag("netease");
      renderSrcPanel();
      runSearch();
      return;
    }
    /* 搜不到和搜失败是两回事，别都写成「没搜到」：这里给一个能点的重试 */
    ul.innerHTML = "";
    var li = document.createElement("li");
    li.className = "empty retry";
    li.textContent = "搜索没成功，点这里再试一次";
    li.onclick = function () { runSearch(); };
    ul.appendChild(li);
    $("resCount").textContent = "";
  }).then(function () {
    if ($("kw").value.trim() === q) go.disabled = false;
  });
}
function renderSonglist(ul, list) {
  ul.innerHTML = "";
  if (!list.length) {
    ul.innerHTML = '<li class="empty">没搜到，换个关键词试试</li>';
    return;
  }
  for (var i = 0; i < list.length; i++) {
    (function (it, idx) {
      var li = document.createElement("li");
      if (idx === S.idx) li.className = "cur";
      li.style.setProperty("--i", String(Math.min(idx, 12)));
      li.innerHTML =
        '<span class="idx">' + (idx + 1) + '</span>' +
        '<span class="im"><img src="' + escAttr(it.pic) + '" loading="lazy" decoding="async" alt="">' +
        '<span class="eq"><i></i><i></i><i></i></span></span>' +
        '<div class="meta"><div class="t">' + escText(it.title) + '</div><div class="s">' + escText(it.author) + '</div></div>';
      li.onclick = function () { playFromList(list, idx); };
      imgFallback(li.querySelector("img"));
      ul.appendChild(li);
    })(list[i], i);
  }
}

/* ---------- 播放（加载失败 → 重试 → 换源，不再直接跳下一首） ---------- */
var CANDIDATES = [
  { s: "netease", name: "网易云" },
  { s: "tencent", name: "QQ音乐" },
  { s: "kugou", name: "酷狗" },
  { s: "kuwo", name: "酷我" },
  { s: "baidu", name: "百度" }
];
var SRC_NAMES = {};
(function () { for (var i = 0; i < CANDIDATES.length; i++) SRC_NAMES[CANDIDATES[i].s] = CANDIDATES[i].name; })();

/* =========================================================
   音源检测
   ------------------------------------------------------------
   可用平台随上游部署而变（QQ 的搜索接口已失效、部分平台直接 400），
   所以不写死「哪个平台能用」。页面加载后在后台跑一轮实测，对每个平台
   分别验两项能力：
     搜得到 = 按关键词搜索能返回结果
     播得出 = 拿搜到的 id 去 /resolve 能解出音频地址（只解地址，不取字节）
   两项都过的才进换源池。结论缓存 30 分钟，检测过程对用户可见：
   顶栏音源标签可点开面板，列出每个平台的结论，也能手动指定音源。

   优先问同源 /sources（Worker 里并行探测，一次往返拿全部结论）；
   页面被非 Worker 环境直接打开时退回前端逐个探测。
   ========================================================= */
var PROBE_KEYWORD = "周杰伦";
var PROBE_TTL = 30 * 60 * 1000;
var SRC_STORE = "mm_srcs_v2";   /* 检测结论 */
var SRV_STORE = "mm_srv_v1";    /* 用户手动指定的音源 */
var SCAN = { state: "idle", rows: [], pending: null, at: 0 };
var POOL = null;

function srcName(s) { return SRC_NAMES[s] || s; }
function readRows() {
  try {
    var o = JSON.parse(localStorage.getItem(SRC_STORE) || "null");
    if (o && Array.isArray(o.rows) && o.rows.length && Date.now() - (o.at || 0) < PROBE_TTL) return o;
  } catch (e) {}
  return null;
}
function writeRows() {
  try { localStorage.setItem(SRC_STORE, JSON.stringify({ at: SCAN.at, rows: SCAN.rows })); } catch (e) {}
}
/* 归一化：候选表是固定的，缺失的补成「不可用」，顺序也固定 */
function applyRows(rows, at) {
  rows = (rows && rows.length) ? rows : [];
  var out = [];
  for (var i = 0; i < CANDIDATES.length; i++) {
    var got = null;
    for (var j = 0; j < rows.length; j++) if (rows[j] && rows[j].server === CANDIDATES[i].s) { got = rows[j]; break; }
    out.push({
      server: CANDIDATES[i].s,
      name: CANDIDATES[i].name,
      search: !!(got && got.search),
      play: !!(got && got.play),
      count: (got && got.count) || 0,
      note: (got && got.note) || "",
      playNote: (got && got.playNote) || ""
    });
  }
  SCAN.rows = out;
  SCAN.at = at || Date.now();
  SCAN.state = "done";
  POOL = null;
  writeRows();
}
function rowOf(s) {
  for (var i = 0; i < SCAN.rows.length; i++) if (SCAN.rows[i].server === s) return SCAN.rows[i];
  return { server: s, name: srcName(s), search: false, play: false, count: 0, note: "", playNote: "" };
}
/* 换源池：搜得到且播得出的优先；都没有就退到「搜得到」；再不行用当前音源 */
function pool() {
  if (POOL && POOL.length) return POOL;
  var ok = [], half = [];
  for (var i = 0; i < SCAN.rows.length; i++) {
    if (!SCAN.rows[i].search) continue;
    if (SCAN.rows[i].play) ok.push(SCAN.rows[i].server); else half.push(SCAN.rows[i].server);
  }
  POOL = ok.length ? ok : (half.length ? half : [S.server || "netease"]);
  return POOL;
}
function okCount() {
  var n = 0;
  for (var i = 0; i < SCAN.rows.length; i++) if (SCAN.rows[i].search && SCAN.rows[i].play) n++;
  return n;
}
function scanSources(force, cb) {
  if (typeof cb !== "function") cb = function () {};
  if (!force && SCAN.state === "done") { renderSrcPanel(); cb(SCAN.rows); return; }
  if (SCAN.pending) { SCAN.pending.push(cb); return; }
  if (!force) {
    var cached = readRows();
    if (cached) { applyRows(cached.rows, cached.at); renderSrcPanel(); cb(SCAN.rows); return; }
  }
  SCAN.pending = [cb];
  SCAN.state = "run";
  renderSrcPanel();
  fetchUrl("/sources?r=" + (Date.now() % 1000000), 18000)
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var rows = (j && (j.rows || j.sources)) || null;
      if (!rows || !rows.length) throw new Error("empty");
      applyRows(rows, j.at);
      doneScan();
    })
    .catch(function () {
      return Promise.all(CANDIDATES.map(function (c) { return probeOne(c.s); }))
        .then(function (rows) { applyRows(rows, Date.now()); doneScan(); });
    })
    .catch(function () { applyRows([], Date.now()); doneScan(); });
}
function doneScan() {
  var q = SCAN.pending || [];
  SCAN.pending = null;
  renderSrcPanel();
  for (var i = 0; i < q.length; i++) q[i](SCAN.rows);
}
/* 前端兜底探测：搜一句 → 拿第一条的 id 去解地址。每步单独限时，
   某个平台挂起不会拖死整轮 */
function probeOne(srv) {
  var row = { server: srv, name: srcName(srv), search: false, play: false, count: 0, note: "", playNote: "" };
  return route(apiUrl("search", PROBE_KEYWORD, srv), upUrl("search", PROBE_KEYWORD, srv), JSON_TIMEOUT)
    .then(function (r) { return r.json(); })

function parseLrc(text) {
  var rows = [];
  var lines = String(text || "").split(String.fromCharCode(10));
  var i, j, line, rest, times, tag, p, mm, ss, content;
  for (i = 0; i < lines.length; i++) {
    line = lines[i].trim();

    times = [];
    rest = line;
    while (rest.charAt(0) === "[") {
      var end = rest.indexOf("]");
      if (end < 0) break;
      tag = rest.slice(1, end);
      p = tag.indexOf(":");
      if (p <= 0) break;
      mm = Number(tag.slice(0, p));
      ss = Number(tag.slice(p + 1).replace(",", "."));
      if (!isFinite(mm) || !isFinite(ss)) break;
      times.push(mm * 60 + ss);
      rest = rest.slice(end + 1);
    }
    content = rest.trim() || "♪";
    if (isLrcMeta(content)) { content = ""; }
    if (!content) continue;
    if (times.length) {
      for (j = 0; j < times.length; j++) rows.push({ t: times[j], c: content });

      /* 同一时间戳的下一行就是翻译；这一行自己带括号翻译时以行内那个为准 */
      var pair = splitLrcLine(cur.c);
      out.push({ t: cur.t, c: pair.main, tl: cleanTr(pair.tr || nxt.c) });
      i++;

}
/* 制作信息不是歌词：「作词 : 黄家驹」「混音工程师：xxx」这类直接从列表里剔掉 */
function isLrcMeta(text) {
  var s = String(text == null ? "" : text).trim();

  return /^(作词|作曲|编曲|作词作曲|混音|混录|录音|监制|出品|发行|统筹|策划|制作人|制作Producer|和声|吉他|贝斯|鼓|弦乐|键盘|钢琴|混音师|母带|后期|制作助理|出品公司|发行公司|SP|OP|歌手|演唱|词|曲|演唱者|演唱歌手|原唱|Artist|Producer|Mix|Master|Lyricist|Composer)\s*[:：]/i.test(s);

/* 行尾的括号内容当翻译：「今天又是… (translation)」拆成原文 + 翻译 */
function splitLrcLine(text) {
  var s = String(text == null ? "" : text).trim();

  var m = s.match(/^(.*?)[（(]([^（()）]{1,80})[)）]\s*$/);

  for (var i = HIST.length - 1; i >= 0; i--) {

    statusModal("ok", "已加入播放", list.length + " 首");
  }).catch(function () {
    statusModal("fail", "歌单拉取失败", "歌单 " + p.id);
  });
}

/* ---------- 登录 ---------- */
var LOGIN_HOST = "https://oauth.107211.xyz";
/* 登录用各家网站自己的图标（favicon），按顺序试，都挂了就退回色块字母。
   顺序按实测可达性排：x.com / abs.twimg.com 在部分网络下直接超时，先走镜像。 */
var PROVIDER_ICONS = {
  github: ["https://github.com/favicon.ico", "https://icon.horse/icon/github.com"],
  microsoft: ["https://www.microsoft.com/favicon.ico", "https://icon.horse/icon/microsoft.com"],
  twitter: ["https://icon.horse/icon/twitter.com", "https://icon.horse/icon/x.com"],
  gitlab: ["https://gitlab.com/favicon.ico", "https://icon.horse/icon/gitlab.com"],
  qq: ["https://im.qq.com/favicon.ico", "https://connect.qq.com/favicon.ico", "https://icon.horse/icon/qq.com"]
};
function providerIconURLs(id) {
  var v = PROVIDER_ICONS[String(id || "").toLowerCase()];
  return v && v.length ? v : [];
}
/* 逐个候选试；某个地址既不 onload 也不 onerror（被墙 / 挂住）就等 4 秒换下一个，
   全部落空就把 img 摘掉，露出底下那个色块字母。 */
function providerIconLoader(img, urls) {
  var chain = urls.slice(), timer = 0;
  function giveUp() {
    if (timer) { clearTimeout(timer); timer = 0; }
    img.onload = img.onerror = null;
    if (img.parentNode) img.parentNode.removeChild(img);
  }
  function next() {
    if (!chain.length) { giveUp(); return; }
    var u = chain.shift();
    img.onload = function () { if (timer) { clearTimeout(timer); timer = 0; } };
    img.onerror = function () { if (timer) { clearTimeout(timer); timer = 0; } next(); };
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { timer = 0; next(); }, 4000);
    img.src = u;
  }
  if (!chain.length) { giveUp(); return; }
  next();
}
var OAUTH_PROVIDERS = [
  { id: "github", name: "GitHub", color: "#24292f", letter: "GH" },
  { id: "microsoft", name: "Microsoft", color: "#00a4ef", letter: "MS" },
  { id: "twitter", name: "Twitter / X", color: "#1da1f2", letter: "X" },
  { id: "gitlab", name: "GitLab", color: "#fc6d26", letter: "GL" },
  { id: "qq", name: "QQ", color: "#12b7f5", letter: "Q" }
];
var OAUTH_PROVIDERS_LOADED = false;
function loadProviders() {
  if (OAUTH_PROVIDERS_LOADED) return;
  OAUTH_PROVIDERS_LOADED = true;
  getJSON(LOGIN_HOST + "/api/providers", 0).then(function (data) {
    var arr = data && data.providers;
    if (!Array.isArray(arr) || !arr.length) return;
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var p = arr[i];
      if (!p || !p.id) continue;
      out.push({
        id: p.id,
        name: p.label || p.id,
        color: p.color || "#222",
        letter: (p.icon || p.id).slice(0, 2).toUpperCase(),
        icons: providerIconURLs(p.id)
      });
    }
    if (out.length) OAUTH_PROVIDERS = out;
  }).catch(function () {});
}
function currentUser() {
  try { return JSON.parse(localStorage.getItem("mus_user") || "null"); } catch (e) { return null; }
}
function saveUser(u) {
  try { localStorage.setItem("mus_user", JSON.stringify(u)); } catch (e) {}
}
function clearUser() {
  try { localStorage.removeItem("mus_user"); } catch (e) {}
}
function renderUser(u) {
  var btn = $("btnLogin");
  if (u && u.name) {
    btn.classList.add("user");
    btn.innerHTML =
      '<span class="av">' + (u.avatar ? '<img src="' + escAttr(u.avatar) + '" alt="">' : escText((u.name || "?").charAt(0))) + '</span>' +
      '<span class="nm">' + escText(u.name) + '</span>';
    var av = btn.querySelector("img");
    if (av) imgFallback(av);
  } else {
    btn.classList.remove("user");
    btn.textContent = "登录";
  }
}
function openLogin() {
  $("loginLayer").classList.add("on");
  var u = currentUser();
  var box = $("providerList");
  box.innerHTML = "";
  $("loginTitle").textContent = u && u.name ? "已登录" : "登录";
  if (u && u.name) {
    var pf = document.createElement("div");
    pf.className = "profile";
    pf.innerHTML =
      '<span class="av">' + (u.avatar ? '<img src="' + escAttr(u.avatar) + '" alt="">' : escText((u.name || "?").charAt(0))) + '</span>' +
      '<div><div class="nm">' + escText(u.name) + '</div>' +
      (u.email ? '<div class="em">' + escText(u.email) + '</div>' : '') +
      (u.provider ? '<div class="em">via ' + escText(u.provider) + '</div>' : '') +
      '</div>';
    var pav = pf.querySelector("img");
    if (pav) imgFallback(pav);
    box.appendChild(pf);
    var lo = document.createElement("div");
    lo.className = "pv";
    lo.innerHTML = '<span class="lg" style="background:#8a9098">↪</span><span class="nm">退出登录</span><span class="arr">›</span>';
    lo.onclick = function () { doLogout(); };
    box.appendChild(lo);
  } else {
    loadProviders();
    OAUTH_PROVIDERS.forEach(function (p) {
      var d = document.createElement("div");
      d.className = "pv";
      var icons = p.icons || providerIconURLs(p.id);
      var iconHtml = "";
      if (icons.length) {
        /* 图标挂在色块字母上面：加载成功后字母被盖住，失败就把 img 摘掉露出字母 */
        iconHtml = '<img src="' + escAttr(icons[0]) + '" alt="" loading="lazy">';
      }
      d.innerHTML = '<span class="lg" style="background:' + escAttr(p.color) + '"><i>' + escText(p.letter) + '</i>' + iconHtml + '</span><span class="nm">' + p.name + '</span><span class="arr">›</span>';
      if (icons.length) {
        var lg = d.querySelector(".lg img");
        if (lg) providerIconLoader(lg, icons);
      }
      d.onclick = function () {
        location.href = LOGIN_HOST + "/auth/" + p.id + "?ref=" + encodeURIComponent(location.href);
      };
      box.appendChild(d);
    });
  }
}
function closeLogin() { $("loginLayer").classList.remove("on"); }
function doLogout() {
  clearUser();
  closeLogin();
  renderUser(null);
}
function parseLoginReturn() {
  var q = new URLSearchParams(location.search);
  if (q.get("oauth_success") === "1") {
    saveUser({
      name: q.get("name") || "用户",
      username: q.get("username") || "",
      email: q.get("email") || "",
      avatar: q.get("avatar") || "",
      provider: q.get("provider") || "",
      at: Date.now()
    });
    renderUser(currentUser());
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.hash);
  } else {
    renderUser(currentUser());
  }
}

$("searchForm").addEventListener("submit", function (e) {
