<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3f0">
<meta name="format-detection" content="telephone=no">
<title>次元星域音乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231a1b1d'/%3E%3Cpath d='M9 18V6l10-2v12a3 3 0 1 1-2-2.83V8.6l-6 1.2V18a3 3 0 1 1-2-2.83z' fill='%23f4f3f0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.107211.xyz" crossorigin>
<link rel="dns-prefetch" href="https://api.107211.xyz">
<link rel="preconnect" href="https://t.alcy.cc">
<link rel="dns-prefetch" href="https://t.alcy.cc">
<link rel="preload" as="image" href="https://t.alcy.cc/tx" fetchpriority="high">
<style>
:root{
  --paper:#f4f3f0;
  --card:#fffefb;
  --ink:#1a1b1d;
  --ink2:#5a5d62;
  --ink3:#8b8e93;
  --line:#e4e2dc;
  --line2:#d2cfc7;
  --acc:#b4461f;
  --acc2:#8d3414;
  --accw:#f8ece7;
  --d0:#151618;
  --di:#f1f0ed;
  --di2:#9ea1a7;
  --dline:#2b2d32;
  --ok:#2c6e4a;
  --bad:#a33131;
  --player-h:74px;
  --r:6px;
  --sans:"HarmonyOS Sans SC","MiSans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);
  font-size:14px;line-height:1.5;
  background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
img{display:block}
a{color:var(--acc2)}
::selection{background:#e6d5cb;color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid transparent;background-clip:content-box;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#b6b2a8;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.wrap{max-width:760px;margin:0 auto;padding:0 20px}

/* ============ 顶栏 ============ */
.nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  height:52px;padding:0 max(20px,env(safe-area-inset-left));
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{
  width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--card);border-radius:5px;
}
.brand .logo svg{width:13px;height:13px;display:block}
.brand .nm{font-size:15px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.src-tag{
  font-size:12px;color:var(--ink3);letter-spacing:.02em;white-space:nowrap;
  padding:3px 8px;border:1px solid var(--line);border-radius:4px;
}
.btn{
  height:32px;padding:0 14px;border-radius:5px;
  border:1px solid var(--line2);background:var(--card);
  font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:#fff;border-color:#b9b5ab}
.btn:active{background:#f0eee9}
.btn.user{padding-right:12px}
.btn .av{width:19px;height:19px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:var(--acc);color:#fff;font-size:11px;font-weight:600}
.btn .av img{width:100%;height:100%;object-fit:cover}
.btn .nm{max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ 搜索区 ============ */
.hero{padding:38px 0 22px}
.hero.searching{padding:22px 0 18px}
.hero-t{overflow:hidden;transition:max-height .22s ease,opacity .18s ease,margin .22s ease;max-height:120px}
.hero.searching .hero-t{max-height:0;opacity:0;margin:0}
.hero h1{font-size:22px;font-weight:600;letter-spacing:.01em}
.hero p{margin-top:5px;font-size:13px;color:var(--ink3)}
.search{
  margin-top:18px;display:flex;align-items:center;gap:8px;
  height:44px;padding:0 6px 0 13px;background:var(--card);
  border:1px solid var(--line2);border-radius:var(--r);
  transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:#9d998e;box-shadow:0 0 0 3px rgba(26,27,29,.05)}
.search svg.mag{flex:none;width:16px;height:16px;color:var(--ink3)}
.search:focus-within svg.mag{color:var(--ink2)}
.search input{flex:1;min-width:0;height:100%;border:none;outline:none;background:none;font-size:14px}
.search input::placeholder{color:#a9a69e}
.search .go{
  flex:none;height:32px;padding:0 18px;border-radius:5px;
  background:var(--ink);color:#f6f5f2;font-size:13px;font-weight:500;
  transition:background .15s;
}
.search .go:hover{background:#000}
.search .go:active{background:#3d3e41}
.search .go[disabled]{background:#c9c6bf;cursor:default}

/* ============ 结果 ============ */
.results{margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.results[hidden]{display:none}
.res-hd{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.res-hd h2{font-size:13px;font-weight:600;letter-spacing:.02em}
.res-hd .n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.res-hd .all{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  font-size:12.5px;color:var(--acc2);font-weight:500;
}
.res-hd .all svg{width:12px;height:12px}
.res-hd .all:hover{text-decoration:underline}
.res-hd .all[disabled]{color:var(--ink3);cursor:default;text-decoration:none}

.songlist{list-style:none}
.songlist li{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--line);
  transition:background .12s;
}
.songlist li:last-child{border-bottom:0}
.songlist li:hover{background:#f7f6f3}
.songlist li.cur{background:var(--accw)}
.songlist li.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.songlist .idx{
  flex:none;width:20px;text-align:right;
  font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;
}
.songlist li.cur .idx{color:var(--acc2)}
.songlist .im{position:relative;flex:none;width:40px;height:40px;border-radius:4px;overflow:hidden;background:#ecebe6}
.songlist .im img{width:100%;height:100%;object-fit:cover}
.songlist .im .eq{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:2px;
  background:rgba(21,22,24,.55);
}
.songlist li.cur .im .eq{display:flex}
.songlist .im .eq i{width:2px;height:5px;background:#fff;animation:eq .9s ease-in-out infinite}
.songlist .im .eq i:nth-child(2){animation-delay:.22s}
.songlist .im .eq i:nth-child(3){animation-delay:.44s}
@keyframes eq{0%,100%{height:5px}50%{height:14px}}
body.paused .songlist li.cur .im .eq i{animation-play-state:paused}
.songlist .meta{flex:1;min-width:0}
.songlist .meta .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songlist li.cur .meta .t{color:var(--acc2);font-weight:500}
.songlist .meta .s{margin-top:1px;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songlist .empty{display:block;padding:38px 16px;text-align:center;font-size:13px;color:var(--ink3);cursor:default}
.songlist .empty.retry{cursor:pointer;color:var(--acc2)}
.songlist .empty.retry:hover{text-decoration:underline}
.songlist .empty:hover{background:none}

/* ============ 底部播放器 ============ */
#audio{display:none}
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--d0);border-top:1px solid var(--dline);
  padding-bottom:env(safe-area-inset-bottom);
}
.prog{
  position:relative;height:3px;cursor:pointer;touch-action:none;
  user-select:none;background:#33353a;transition:height .12s;
}
.prog:hover{height:6px}
.prog .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#e6e3dc}
.prog .knob{
  position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform .12s;
}
.prog:hover .knob,.prog.drag .knob{transform:translate(-50%,-50%) scale(1)}
.p-row{display:flex;align-items:center;gap:14px;height:var(--player-h);padding:0 16px}
.cov{
  position:relative;flex:none;width:46px;height:46px;border-radius:4px;overflow:hidden;
  background:#232528;cursor:pointer;
}
.cov img{width:100%;height:100%;object-fit:cover}
.cov .cov-mask{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(12,13,14,.55);color:#fff;opacity:0;transition:opacity .15s;
}
.cov:hover .cov-mask{opacity:1}
.cov .cov-mask svg{width:18px;height:18px}
.cov.busy .cov-mask{opacity:1}
.cov.busy .cov-mask svg{display:none}
.cov.busy .cov-mask::before{
  content:"";width:16px;height:16px;border-radius:50%;
  border:1.6px solid rgba(255,255,255,.28);border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.p-now{flex:1;min-width:0;cursor:pointer;padding:4px 0}
.p-now .t{font-size:13.5px;font-weight:500;color:var(--di);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-now .s{margin-top:1px;font-size:11.5px;color:var(--di2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.p-now .s .hint{color:#d08a63}
.p-ctrl{display:flex;align-items:center;gap:4px;flex:none}
.ic{
  width:36px;height:36px;border-radius:5px;color:var(--di2);
  display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s;
}
.ic svg{width:19px;height:19px}
.ic:hover{color:var(--di);background:#242629}
.ic:active{background:#2b2d31}
.ic-play{width:42px;height:42px;background:#f1f0ed;color:#151618}
.ic-play svg{width:20px;height:20px}
.ic-play:hover{background:#fff;color:#000}
.ic-play:active{background:#ddd9d2}
.p-time{flex:none;min-width:74px;text-align:right;font-size:11.5px;color:var(--di2);font-variant-numeric:tabular-nums}
.p-time .sep{margin:0 4px;color:#4e5158}

/* ============ 歌词页 ============ */
.lyr{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:var(--d0);overflow:hidden}
.lyr.on{display:flex}
.lyr .bg{
  position:absolute;inset:-60px;background-size:cover;background-position:center;
  filter:blur(64px) brightness(.34) saturate(.85);opacity:.7;
}
.lyr .veil{position:absolute;inset:0;background:rgba(15,16,18,.72)}
.lyr .lyr-top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 20px 6px}
.lyr .lyr-top .tt{flex:1;min-width:0}
.lyr .lyr-top b{display:block;font-size:14.5px;font-weight:600;color:var(--di);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr .lyr-top span{display:block;margin-top:2px;font-size:11.5px;color:var(--di2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr .lyr-x{
  flex:none;width:32px;height:32px;border-radius:5px;color:var(--di2);
  display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
}
.lyr .lyr-x:hover{background:#24262a;color:var(--di)}
.lyr .lyr-x svg{width:16px;height:16px}
.lyr-main{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:44px;padding:10px 40px}
.lyr-art{flex:none;width:min(30vh,248px)}
.lyr-art img{
  width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);background:#232528;
}
.lyr-lrc{flex:1 1 auto;min-width:0;height:100%}
.lrc-box{
  position:relative;height:100%;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent);
}
.lrc-wrap{position:relative;height:100%}
.lrc-tr{position:relative;transition:transform .4s ease}
.l-line{
  padding:7px 2px;font-size:14.5px;line-height:1.7;color:#767a81;cursor:pointer;
  transition:color .2s,font-size .2s;word-break:break-word;
}
.l-line:hover{color:#b9bcc2}
.l-line .tr{display:block;font-size:12.5px;color:#5f6369;margin-top:1px}
.l-line.acti{color:var(--di);font-size:17px;font-weight:600}
.l-line.acti .tr{color:#8b8e94;font-weight:400}
.lrc-none{padding:40px 2px;font-size:13px;color:#6d7076}
.lyr .lyr-foot{position:relative;z-index:2;padding:0 40px 22px}
.lyr .lyr-prog{height:3px;margin-bottom:12px}
.lyr .lyr-bar{display:flex;align-items:center;gap:16px}
.lyr .lyr-time{flex:none;width:82px;font-size:11.5px;color:var(--di2);font-variant-numeric:tabular-nums}
.lyr .lyr-ctrl{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.lyr .lyr-tools{flex:none;display:flex;align-items:center;gap:4px;width:82px;justify-content:flex-end}

.queue{
  position:absolute;right:20px;bottom:104px;z-index:4;
  width:min(320px,86vw);max-height:56%;display:none;flex-direction:column;
  background:rgba(28,29,32,.97);border:1px solid var(--dline);border-radius:8px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.5);
}
.queue.on{display:flex}
.queue .qh{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--dline);font-size:12.5px;font-weight:600;color:var(--di)}
.queue .qh .n{font-size:11px;color:var(--di2);font-weight:400;font-variant-numeric:tabular-nums}
.queue .qh .x{margin-left:auto;width:24px;height:24px;border-radius:4px;color:var(--di2);display:flex;align-items:center;justify-content:center}
.queue .qh .x:hover{background:#2b2d31;color:var(--di)}
.queue .qh .x svg{width:13px;height:13px}
.queue ol{list-style:none;overflow-y:auto}
.queue li{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .12s}
.queue li:hover{background:#242629}
.queue li.cur{background:#2a2119}
.queue li .t{flex:1;min-width:0;font-size:12.5px;color:#c9cbcf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue li.cur .t{color:#e0a07a;font-weight:500}
.queue li .a{flex:none;max-width:88px;font-size:11px;color:#71747a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ 登录 ============ */
.mask{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(26,27,29,.34)}
.mask.on{display:flex}
.panel{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(26,27,29,.2)}
.panel .ph{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel .ph b{font-size:13.5px;font-weight:600}
.panel .ph .x{margin-left:auto;width:26px;height:26px;border-radius:4px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.panel .ph .x:hover{background:#f0eee9;color:var(--ink)}
.panel .ph .x svg{width:14px;height:14px}
.panel .pd{display:flex;flex-direction:column;padding:6px}
.pv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;cursor:pointer;transition:background .12s}
.pv:hover{background:#f6f5f1}
.pv .lg{width:22px;height:22px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:600;letter-spacing:.02em}
.pv .nm{flex:1;font-size:13.5px}
.pv .arr{font-size:15px;color:#b5b2aa}
.pv:hover .arr{color:var(--acc)}
.profile{display:flex;align-items:center;gap:10px;padding:10px;margin:6px}
.profile .av{width:36px;height:36px;flex:none;border-radius:50%;overflow:hidden;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600}
.profile .av img{width:100%;height:100%;object-fit:cover}
.profile .nm{font-size:13.5px;font-weight:500}
.profile .em{font-size:11.5px;color:var(--ink3);word-break:break-all}

/* ============ 提示条 ============ */
#statusModal{
  position:fixed;left:0;right:0;top:64px;z-index:1200;
  display:flex;justify-content:center;padding:0 16px;
  pointer-events:none;opacity:0;transform:translateY(-6px);
  transition:opacity .18s ease,transform .18s ease;
}
#statusModal.show{opacity:1;transform:none}
#statusModal .sm-box{
  display:flex;align-items:center;gap:8px;max-width:100%;
  padding:8px 14px;border-radius:6px;
  background:var(--card);border:1px solid var(--line2);
  box-shadow:0 6px 20px rgba(26,27,29,.1);
  color:var(--ink);
}
#statusModal.load .sm-box{border-color:#c6c2b8}
#statusModal.ok .sm-box{color:var(--ok);border-color:#bcd8c7}
#statusModal.fail .sm-box{color:var(--bad);border-color:#e2c4c4}
#statusModal.tip .sm-box{color:var(--acc2);border-color:#e4cbbc}
.sm-icon{width:15px;height:15px;flex:none}
.sm-icon svg{width:100%;height:100%;display:block}
.sm-icon .c{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.9}
.sm-icon .m{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
#statusModal.load .sm-icon .m{stroke-dasharray:12 27;animation:spin .8s linear infinite}
.sm-title{font-size:13px;font-weight:500;white-space:nowrap}
.sm-sub{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 加载中的小横条：不玩扫光，就一截实心条安静地呼吸 */
#statusModal .sm-box .sm-bar{display:none}
#statusModal.load .sm-box .sm-bar{display:block;width:30px;height:2px;background:#e6e3dc;border-radius:2px;flex:none;overflow:hidden}
.sm-bar i{display:block;height:100%;width:100%;background:var(--acc);animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}

/* ============ 自适应 ============ */
@media (max-width:720px){
  .lyr-main{flex-direction:column;gap:16px;padding:6px 20px}
  .lyr-art{width:min(22vh,120px)}
  .lyr-lrc{width:100%}
  .lyr .lyr-foot{padding:0 20px 18px}
  .lyr .lyr-bar{gap:8px}
  .lyr .lyr-tools,.lyr .lyr-time{width:64px}
  .queue{right:12px;bottom:96px}
}
@media (max-width:520px){
  .wrap{padding:0 14px}
  .nav{padding:0 max(14px,env(safe-area-inset-left))}
  .brand .nm{font-size:14px}
  .src-tag{display:none}
  .p-row{gap:10px;padding:0 12px}
  .p-time{display:none}
  .ic{width:34px;height:34px}
  .ic-play{width:40px;height:40px}
  .songlist li{padding:9px 12px;gap:10px}
  .res-hd{padding:11px 12px}
  .hero{padding:28px 0 18px}
  .hero h1{font-size:20px}
}
@media (max-height:520px) and (orientation:landscape){
  .lyr-main{flex-direction:row;align-items:center;padding:0 24px;gap:24px}
  .lyr-art{width:min(24vh,110px)}
  .lyr-lrc{height:100%}
  .lyr .lyr-foot{padding:0 24px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>

</head>
<body>

<header class="nav">
  <div class="brand">

<script>
(function () {
"use strict";

/* 次元星域音乐 —— 仅搜索 / 登录 / 歌词 / 播放 */

var S = {
  server: "netease", list: [], idx: -1, lrc: [], lrcIdx: -1, mode: 0,
  tk: 0, cands: null, ci: 0, same: 0, tried: null, switching: false,
  retryT: 0, watchT: 0, watching: false, pausedByUser: false, failAt: 0
};
var MODE_ICONS = [
  '<path d="M2 17H4.5l-.18-1H2v-2h4v2.5L4.18 19H6v2H2v-2zm4-12H9.4L9 4H7V2h4v2.5L9.82 7H11v2H6V5zm4 4h12v2H10v-2zm0 5h12v2H10v-2z"/>',
  '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>',
  '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/>'
];
var audio = document.getElementById("audio");
var DEFAULT_ART = "https://t.alcy.cc/tx";

/* ---------- 接口地址 ----------
   默认全部走同源 Worker 路由：上游密钥（HMAC）、多站点兜底链都在 Worker 侧，
   直连上游既算不出签名，也会把「Worker 出口被 CDN 屏蔽」的问题原样带过来。
   只有页面被非 Worker 环境直接打开（本地双击 index.html）时，同源路由不可用，
   才会自动退回上游直连。 */
var UPSTREAM = "https://api.107211.xyz/api";
var toUpstream = false;
var HEALTH = {};   /* /health 的结论，只在「所有音源都失败」后查一次，用于事后解释原因 */
function qs(server, type, id, r) {
  return "server=" + encodeURIComponent(server || S.server) +
         "&type=" + encodeURIComponent(type) +
         "&id=" + encodeURIComponent(id) +
         (r ? "&r=" + encodeURIComponent(r) : "");
}
function apiUrl(type, id, server, r) { return "/api?" + qs(server, type, id, r); }
function upUrl(type, id, server, r) { return UPSTREAM + "?" + qs(server, type, id, r); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* 带超时的请求。url 可以是字符串，也可以是「同源/上游二选一」的 Promise */
function fetchUrl(urlP, ms) {
  return Promise.resolve(urlP).then(function (u) {
    var ctrl = null, timer = 0;
    try {
      if (typeof AbortController === "function") {
        ctrl = new AbortController();
        timer = setTimeout(function () { ctrl.abort(); }, ms || 8000);
      }
    } catch (e) { ctrl = null; }
    return fetch(u, ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error("http " + r.status);
      return r;
    }, function (e) {
      if (timer) clearTimeout(timer);
      throw e;
    });
  });
}
/* 同源优先；同源请求失败就改走上游再试一次（两次都失败才认定这条路不通） */
function route(sameUrl, upstreamUrl, ms) {
  if (toUpstream) return fetchUrl(upstreamUrl, ms);
  return fetchUrl(sameUrl, ms).catch(function () {
    toUpstream = true;
    return fetchUrl(upstreamUrl, ms).catch(function (e) { toUpstream = false; throw e; });
  });
}
/* JSON 类接口的容忍度高一些：上游冷启动实测能到 6 秒多，
   用 8 秒的默认超时去卡搜索，会在网络稍差时把好端端的搜索判成失败 */
var JSON_TIMEOUT = 12000;
function apiJSON(type, id, server, r, tries) {
  tries = (tries == null) ? 1 : tries;
  return route(apiUrl(type, id, server, r), upUrl(type, id, server, r), JSON_TIMEOUT)
    .then(function (res) { return res.json(); })
    .catch(function (e) {
      if (tries > 0) return wait(400).then(function () { return apiJSON(type, id, server, r, tries - 1); });
      throw e;
    });
}
function coverUrl(id, server) {
  return toUpstream ? upUrl("pic", id, server) : ("/cover?" + qs(server, "pic", id));
}
function lrcUrl(id, server) {
  return toUpstream ? upUrl("lrc", id, server) : ("/lyric?" + qs(server, "lrc", id));
}

/* ---------- 播放地址解析 ----------
   上游 type=url / type=pic 本身不是音频/图片，而是 302 跳到 music.126.net 的 CDN。
   老实现的两个致命问题：
     1) 把 /api?type=url 直接塞给 audio.src —— 那是 JSON（或 Worker 回源后的 525 文本页），
        永远不可能出声；
     2) Worker 服务端跟随这个 302 去 CDN 取流，网易云 CDN 屏蔽 Cloudflare 出口段，
        必然 525（2026-09 线上实测：/api、/lyric 全好，音频与封面确定性挂）。
   现在的做法：让 Worker 用 redirect:"manual" 只解出地址（它手上有密钥与兜底链），
   浏览器再直连 CDN 取流。既绕开 525，进度条的 Range 拖动也照常可用。 */
var NOT_AUDIO = /#\/song|\/discover|\.html?($|\?)/i;
function toHttps(u) { return String(u || "").trim().replace(/^http:\/\//i, "https://"); }
function audioUrlFrom(o, depth) {
  depth = depth || 0;
  if (depth > 4 || o == null) return "";
  if (typeof o === "string") {
    var s = toHttps(o);
    return /^https?:\/\//i.test(s) && !NOT_AUDIO.test(s) ? s : "";
  }
  if (Array.isArray(o)) {
    for (var i = 0; i < o.length; i++) { var a = audioUrlFrom(o[i], depth + 1); if (a) return a; }
    return "";
  }
  if (typeof o === "object") {
    var keys = ["url", "audio", "src", "link", "songurl", "data", "song", "lrc"];
    for (var k = 0; k < keys.length; k++) {
      if (o[keys[k]] != null) { var u = audioUrlFrom(o[keys[k]], depth + 1); if (u) return u; }
    }
    for (var j in o) {
      if (!Object.prototype.hasOwnProperty.call(o, j)) continue;
      var v = audioUrlFrom(o[j], depth + 1);
      if (v) return v;
    }
  }
  return "";
}
/* 上游 302 直跳 CDN 时，浏览器自己跟完，res.url 就是可播地址；其余按 JSON 解析 */
function pickFromRes(res) {
  var ct = (res.headers.get("content-type") || "").toLowerCase();
  if (ct.indexOf("audio/") === 0 || ct.indexOf("video/") === 0 || ct.indexOf("octet-stream") >= 0) {
    try { if (res.body) res.body.cancel(); } catch (e) {}
    return /^https?:/i.test(res.url) ? res.url : "";
  }
  return res.json().then(function (j) { return audioUrlFrom(j); }, function () { return ""; });
}
/* 解析这首歌的可播地址。逐级降级：Worker /resolve → 上游直连 → 搜索结果自带直链。
   三条都空才回调空串，由重试/换源逻辑接手。 */
function resolveAudio(c, cb) {
  var t = S.tk;
  if (c.sr) { cb(c.sr); return; }
  var q = qs(c.s, "url", c.id, String(Date.now() % 1000000));
  var steps = [
    function () { return fetchUrl("/resolve?" + q, 6000).then(pickFromRes); },
    function () { return fetchUrl(UPSTREAM + "?" + q, 6000).then(pickFromRes); }
  ];
  var i = 0;
  (function next() {
    if (!isLive(t)) return;
    if (i >= steps.length) { cb(audioUrlFrom(c.au)); return; }
    var p;
    try { p = steps[i++](); } catch (e) { return next(); }
    p.then(function (u) {
      if (!isLive(t)) return;
      if (u) { c.sr = u; cb(u); } else next();
    }, function () { next(); });
  })();
}

function $(id) { return document.getElementById(id); }
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return ("0" + Math.floor(sec / 60)).slice(-2) + ":" + ("0" + (sec % 60)).slice(-2);
}
function picToHttps(p) { return toHttps(p); }
function idFromUrl(u) {
  var s = String(u || "");
  /* 必须卡住 ?id= / &id= 边界：albumid=99、picid=... 里面也含 "id="，
     用 indexOf 会把 albumid 的值当歌曲 id 取出来，换源后就会播成别的歌 */
  var m = s.match(/[?&]id=([^&#]*)/);
  if (!m) return "";
  try { return decodeURIComponent(m[1] || ""); } catch (e) { return m[1] || ""; }
}
function mapItem(raw, i, server) {
  raw = raw || {};
  var id = raw.id ? String(raw.id) : "";
  if (!id) id = idFromUrl(raw.url || raw.lrc || raw.pic);
  /* 取不到真实 id 就不再伪造 "t"+hash：伪 id 请求 /api、/lyric、/cover 必然失败，
     界面上却显示成一条能播、点了没反应的歌。宁可在结果里滤掉。 */
  return {
    id: id,
    server: raw.server || server || S.server,
    title: String(raw.title || raw.name || raw.song || ""),
    author: String(raw.author || raw.artist || raw.singer || ""),
    pic: picToHttps(raw.pic || raw.cover || raw.picUrl || ""),
    au: String(raw.url || raw.auc || raw.audio || "")
  };
}
/* 至少要有真实 id 或直链音频才 playable */
function usable(it) { return !!(it.id || it.au); }
function toList(data, server) {
  var arr = Array.isArray(data) ? data : ((data && data.data) || []);
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var it = mapItem(arr[i], i, server);
    if (usable(it)) out.push(it);
  }
  return out;
}
function getJSON(url, tries) {
  tries = (tries == null) ? 1 : tries;
  var ctrl = new AbortController();
  var timer = window.setTimeout(function () { ctrl.abort(); }, 6000);
  return fetch(url, { signal: ctrl.signal }).then(function (r) {
    window.clearTimeout(timer);
    return r.json();
  }).catch(function (err) {
    window.clearTimeout(timer);
    if (tries > 0) {
      return new Promise(function (res) { setTimeout(res, 400); }).then(function () { return getJSON(url, tries - 1); });
    }
    throw err;
  });
}
function escText(s) {
  return String(s == null ? "" : s).replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escAttr(s) { return escText(s).replace(/"/g, "&quot;"); }
function imgFallback(img) {
  img.onerror = function () { this.onerror = null; this.src = DEFAULT_ART; };
}

/* ---------- 搜索（输入即搜，结果栏随搜索显隐） ---------- */
var searchTimer = null;
var SEARCH_CACHE = {};
function runSearch() {
  var q = $("kw").value.trim();
  $("radioHero").classList.toggle("searching", q.length > 0);
  var card = $("listCard");
  if (!q) { card.hidden = true; $("btnDoSearch").disabled = false; return; }
  card.hidden = false;
  var ul = $("searchList");
  var go = $("btnDoSearch");
  var got = SEARCH_CACHE[q];
  if (got && got.expire > Date.now()) {
    S.list = got.list.slice();
    S.idx = -1;
    $("resCount").textContent = got.list.length ? got.list.length + " 首" : "";
    renderSonglist(ul, S.list);
    go.disabled = false;
  } else {
    ul.innerHTML = '<li class="empty">搜索中…</li>';
    $("resCount").textContent = "";
    go.disabled = true;
  }
  apiJSON("search", q, S.server, 0, 1).then(function (data) {
    var list = toList(data);
    var keys = Object.keys(SEARCH_CACHE);
    if (keys.length >= 20) delete SEARCH_CACHE[keys[0]];
    SEARCH_CACHE[q] = { list: list.slice(), expire: Date.now() + 5 * 60 * 1000 };
    if ($("kw").value.trim() !== q) return;
    S.list = list;
    S.idx = -1;
    $("resCount").textContent = list.length ? list.length + " 首" : "";
    renderSonglist(ul, list);
  }).catch(function () {
    if ($("kw").value.trim() !== q) return;
    /* 搜不到和搜失败是两回事，别都写成「没搜到」：这里给一个能点的重试 */
    ul.innerHTML = "";
    var li = document.createElement("li");
    li.className = "empty retry";
    li.textContent = "搜索没成功，点这里再试一次";
    li.onclick = function () { runSearch(); };
    ul.appendChild(li);
    $("resCount").textContent = "";
  }).then(function () {
    if ($("kw").value.trim() === q) go.disabled = false;
  });
}
function renderSonglist(ul, list) {
  ul.innerHTML = "";
  if (!list.length) {
    ul.innerHTML = '<li class="empty">没搜到，换个关键词试试</li>';
    return;
  }
  for (var i = 0; i < list.length; i++) {
    (function (it, idx) {
      var li = document.createElement("li");
      if (idx === S.idx) li.className = "cur";
      li.innerHTML =
        '<span class="idx">' + (idx + 1) + '</span>' +
        '<span class="im"><img src="' + escAttr(it.pic) + '" loading="lazy" decoding="async" alt="">' +
        '<span class="eq"><i></i><i></i><i></i></span></span>' +
        '<div class="meta"><div class="t">' + escText(it.title) + '</div><div class="s">' + escText(it.author) + '</div></div>';
      li.onclick = function () { playFromList(list, idx); };
      imgFallback(li.querySelector("img"));
      ul.appendChild(li);
    })(list[i], i);
  }
}

/* ---------- 播放（加载失败 → 重试 → 换源，不再直接跳下一首） ---------- */
/* 候选音源。Meting 各平台可用性随部署/上游而变（QQ 上游搜索接口已挂），
   所以不写死可用列表，而是首次换源时实测「按关键词搜索」这项能力再决定用谁。 */
var CANDIDATES = [
  { s: "netease", name: "网易云" },
  { s: "tencent", name: "QQ音乐" },
  { s: "kugou", name: "酷狗" },
  { s: "kuwo", name: "酷我" },
  { s: "baidu", name: "百度" }
];
var SRC_NAMES = {};
(function () { for (var i = 0; i < CANDIDATES.length; i++) SRC_NAMES[CANDIDATES[i].s] = CANDIDATES[i].name; })();
var CAP_KEY = "mm_srcs_v1";
var CAP_TTL = 30 * 60 * 1000;
var CAP = { list: null, pending: null };

function readCap() {
  try {
    var o = JSON.parse(sessionStorage.getItem(CAP_KEY) || "null");
    if (!o || !Array.isArray(o.list) || !o.list.length) return null;
    if (Date.now() - (o.at || 0) > CAP_TTL) return null;
    return o.list;
  } catch (e) { return null; }
}
function writeCap(list) {
  try { sessionStorage.setItem(CAP_KEY, JSON.stringify({ list: list, at: Date.now() })); } catch (e) {}
}
/* 探测只验「搜索」这一项能力：换源完全依赖它，搜不到的平台留着也没用
   每个探测单独限时，免得某个平台挂起时把整轮探测拖死 */
function probeServer(c) {

function parseLrc(text) {
  var rows = [];
  var lines = String(text || "").split(String.fromCharCode(10));
  var i, j, line, rest, times, tag, p, mm, ss, content;
  for (i = 0; i < lines.length; i++) {
    line = lines[i].trim();
    if (!line) continue;
    times = [];
    rest = line;
    while (rest.charAt(0) === "[") {
      var end = rest.indexOf("]");
      if (end < 0) break;
      tag = rest.slice(1, end);
      p = tag.indexOf(":");
      if (p <= 0) break;
      mm = Number(tag.slice(0, p));
      ss = Number(tag.slice(p + 1).replace(",", "."));
      if (!isFinite(mm) || !isFinite(ss)) break;
      times.push(mm * 60 + ss);
      rest = rest.slice(end + 1);
    }
    content = rest.trim() || "♪";
    if (times.length) {
      for (j = 0; j < times.length; j++) rows.push({ t: times[j], c: content });
    } else if (content !== "♪") {
      rows.push({ t: -1, c: content });
    }
  }
  rows.sort(function (a, b) { return a.t - b.t; });
  var out = [], cur, nxt;
  for (i = 0; i < rows.length; i++) {
    cur = rows[i];
    nxt = rows[i + 1];
    if (nxt && cur.t >= 0 && Math.abs(nxt.t - cur.t) < 0.5 && cur.c !== nxt.c && cur.c !== "♪" && nxt.c !== "♪") {
      out.push({ t: cur.t, c: cur.c, tl: nxt.c });
      i++;
    } else {
      out.push({ t: cur.t, c: cur.c, tl: "" });
    }
  }
  return out;
}

  function seekTo(p) {
    if (isFinite(audio.duration) && audio.duration) audio.currentTime = p * audio.duration;
  }
  bar.addEventListener("pointerdown", function (e) {
    dragging = true;
    bar.classList.add("drag");
    bar.setPointerCapture(e.pointerId);
    seekTo(pos(e));

    if (!dragging) return;
    var p = pos(e);

    bar.querySelector(knobSel).style.left = (p * 100) + "%";
    seekTo(p);

var OAUTH_PROVIDERS = [
  { id: "github", name: "GitHub", color: "#24292f", letter: "GH" },
  { id: "microsoft", name: "Microsoft", color: "#00a4ef", letter: "MS" },
  { id: "twitter", name: "Twitter / X", color: "#1da1f2", letter: "X" },
  { id: "gitlab", name: "GitLab", color: "#fc6d26", letter: "GL" },
  { id: "qq", name: "QQ", color: "#12b7f5", letter: "Q" }
];
var OAUTH_PROVIDERS_LOADED = false;
function loadProviders() {
  if (OAUTH_PROVIDERS_LOADED) return;
  OAUTH_PROVIDERS_LOADED = true;
  getJSON(LOGIN_HOST + "/api/providers", 0).then(function (data) {
    var arr = data && data.providers;
    if (!Array.isArray(arr) || !arr.length) return;
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var p = arr[i];
      if (!p || !p.id) continue;
      out.push({
        id: p.id,
        name: p.label || p.id,
        color: p.color || "#222",
        letter: (p.icon || p.id).slice(0, 2).toUpperCase()
      });
    }
    if (out.length) OAUTH_PROVIDERS = out;
  }).catch(function () {});
}
function currentUser() {
  try { return JSON.parse(localStorage.getItem("mus_user") || "null"); } catch (e) { return null; }
}
function saveUser(u) {
  try { localStorage.setItem("mus_user", JSON.stringify(u)); } catch (e) {}
}
function clearUser() {
  try { localStorage.removeItem("mus_user"); } catch (e) {}
}
function renderUser(u) {
  var btn = $("btnLogin");
  if (u && u.name) {
    btn.classList.add("user");
    btn.innerHTML =
      '<span class="av">' + (u.avatar ? '<img src="' + escAttr(u.avatar) + '" alt="">' : escText((u.name || "?").charAt(0))) + '</span>' +
      '<span class="nm">' + escText(u.name) + '</span>';
    var av = btn.querySelector("img");
    if (av) imgFallback(av);
  } else {
    btn.classList.remove("user");
    btn.textContent = "登录";
  }
}
function openLogin() {
  $("loginLayer").classList.add("on");
  var u = currentUser();
  var box = $("providerList");
  box.innerHTML = "";
  $("loginTitle").textContent = u && u.name ? "已登录" : "登录";
  if (u && u.name) {
    var pf = document.createElement("div");
    pf.className = "profile";
    pf.innerHTML =
      '<span class="av">' + (u.avatar ? '<img src="' + escAttr(u.avatar) + '" alt="">' : escText((u.name || "?").charAt(0))) + '</span>' +
      '<div><div class="nm">' + escText(u.name) + '</div>' +
      (u.email ? '<div class="em">' + escText(u.email) + '</div>' : '') +
      (u.provider ? '<div class="em">via ' + escText(u.provider) + '</div>' : '') +
      '</div>';
    var pav = pf.querySelector("img");
    if (pav) imgFallback(pav);
    box.appendChild(pf);
    var lo = document.createElement("div");
    lo.className = "pv";
    lo.innerHTML = '<span class="lg" style="background:#8a9098">↪</span><span class="nm">退出登录</span><span class="arr">›</span>';
    lo.onclick = function () { doLogout(); };
    box.appendChild(lo);
  } else {
    loadProviders();
    OAUTH_PROVIDERS.forEach(function (p) {
      var d = document.createElement("div");
      d.className = "pv";
      d.innerHTML = '<span class="lg" style="background:' + p.color + '">' + p.letter + '</span><span class="nm">' + p.name + '</span><span class="arr">›</span>';
      d.onclick = function () {
        location.href = LOGIN_HOST + "/auth/" + p.id + "?ref=" + encodeURIComponent(location.href);
      };
      box.appendChild(d);
    });
  }
}
function closeLogin() { $("loginLayer").classList.remove("on"); }
function doLogout() {
  clearUser();
  closeLogin();
  renderUser(null);
}
function parseLoginReturn() {
  var q = new URLSearchParams(location.search);
  if (q.get("oauth_success") === "1") {
    saveUser({
      name: q.get("name") || "用户",
      username: q.get("username") || "",
      email: q.get("email") || "",
      avatar: q.get("avatar") || "",
      provider: q.get("provider") || "",
      at: Date.now()
    });
    renderUser(currentUser());
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.hash);
  } else {
    renderUser(currentUser());
  }
}

/* ---------- 事件 ---------- */
$("kw").addEventListener("input", function () {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  $("radioHero").classList.toggle("searching", q.length > 0);
  if (!q) { $("listCard").hidden = true; $("btnDoSearch").disabled = false; return; }
  searchTimer = setTimeout(runSearch, 200);
});
/* 回车 / 点「搜索」都走 submit，手机上的搜索键也是同一条路 */
$("searchForm").addEventListener("submit", function (e) {
  e.preventDefault();
  clearTimeout(searchTimer);
  runSearch();
});
$("playAll").onclick = function () { if (S.list.length) setQueue(S.list, 0); };

function clickPlay() {
  if (!audio.src) {
    /* 无音源（上一轮全部失败）→ 重新从头加载当前这首 */
    if (S.list.length) playItem(S.idx >= 0 ? S.idx : 0);
    return;
  }
  if (audio.paused) {
    S.pausedByUser = false;
    setBusy(true);
    audio.play().catch(function (err) { onPlayFail(err); });
  } else {
    S.pausedByUser = true;
    clearT("watchT");
    S.watching = false;
    setBusy(false);
    audio.pause();
  }
}
function stepPrev() { if (S.list.length) playItem(S.idx > 0 ? S.idx - 1 : S.list.length - 1); }
function stepNext() { if (S.list.length) playItem(S.idx < S.list.length - 1 ? S.idx + 1 : 0); }
$("btnPlay").onclick = clickPlay;
$("btnLyrPlay").onclick = clickPlay;
$("btnPrev").onclick = stepPrev;
$("btnLyrPrev").onclick = stepPrev;
$("btnNext").onclick = stepNext;
$("btnLyrNext").onclick = stepNext;
$("btnLyrMode").onclick = function () { setMode((S.mode + 1) % 3); };
$("btnLyrQueue").onclick = function () { $("lyrQueue").classList.toggle("on"); };
$("btnLyrQueueClose").onclick = function () { $("lyrQueue").classList.remove("on"); };
$("coverBtn").onclick = openLyrics;
$("nowBtn").onclick = openLyrics;
$("btnLyrClose").onclick = closeLyrics;
$("btnLogin").onclick = openLogin;
$("btnCloseLogin").onclick = closeLogin;
$("loginLayer").addEventListener("click", function (e) { if (e.target === this) closeLogin(); });

audio.addEventListener("timeupdate", onTime);
audio.addEventListener("playing", function () {
  /* 真正开始出声：清掉加载看门狗，重置同源重试计数 */
  clearT("watchT");
  S.watching = false;
  S.same = 0;
  S.failAt = 0;
  setPlaying(true);
  var it = S.list[S.idx];
  if (it) setNow(it.author);
});
audio.addEventListener("pause", function () { setPlaying(false); });
audio.addEventListener("ended", onEnded);
audio.addEventListener("error", function (e) {
  var me = e.target.error;
  if (me && me.code === 1) return;   /* ABORTED：被主动打断，不算失败 */
  onPlayFail(me);
});
window.addEventListener("resize", function () { scrollLrc(); });
var MODE_TIPS = ["顺序播放", "单曲循环", "随机播放"];
function setMode(m) {
  S.mode = m;
  $("lyrModeIcon").innerHTML = MODE_ICONS[m];
  $("btnLyrMode").title = MODE_TIPS[m];
  $("btnLyrMode").setAttribute("aria-label", "播放方式：" + MODE_TIPS[m]);
}
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if ($("lyrQueue").classList.contains("on")) $("lyrQueue").classList.remove("on");
    else if ($("lyrView").classList.contains("on")) closeLyrics();
    else if ($("loginLayer").classList.contains("on")) closeLogin();
    return;
  }
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  /* 快捷键：空格播放/暂停，左右快退快进，上下调音量 */
  if (e.key === " " || e.code === "Space") { e.preventDefault(); clickPlay(); return; }
  if (!audio.src) return;
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    audio.currentTime = Math.max(0, audio.currentTime - (e.shiftKey ? 30 : 5));
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    audio.currentTime = Math.min(isFinite(audio.duration) ? audio.duration : 1e9, audio.currentTime + (e.shiftKey ? 30 : 5));
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    audio.volume = Math.min(1, audio.volume + .05);
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    audio.volume = Math.max(0, audio.volume - .05);
  }
});

bindSeek($("prog"), "progFill", ".knob");
bindSeek($("lyrProg"), "lyrProgFill", ".knob");

imgFallback($("coverImg"));
imgFallback($("lyrImg"));
audio.volume = .85;
setMode(S.mode);
setSrcTag(S.server);
parseLoginReturn();

})();
</script>

    <span class="sm-icon" id="smIcon"></span>
    <span class="sm-title" id="smTitle"></span>
    <span class="sm-sub" id="smSub"></span>
    <span class="sm-bar" id="smBar"><i></i></span>
  </div>
