<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e8590c">
<meta name="format-detection" content="telephone=no">
<title>次元星域音乐</title>
<link rel="preconnect" href="https://api.107211.xyz" crossorigin>
<link rel="dns-prefetch" href="https://api.107211.xyz">
<link rel="preconnect" href="https://t.alcy.cc">
<link rel="dns-prefetch" href="https://t.alcy.cc">
<link rel="preload" as="image" href="https://t.alcy.cc/tx" fetchpriority="high">
<style>
:root{
  --paper:#f6f3ec;
  --card:#fffdf8;
  --ink:#201c15;
  --ink2:#5f594c;
  --ink3:#99917c;
  --line:#e6dfd0;
  --line2:#cfc4ad;
  --acc:#e8590c;
  --acc-d:#cf4a06;
  --acc-l:#fdeee0;
  --player-h:88px;
  --sh:0 1px 2px rgba(80,62,35,.08),0 4px 10px rgba(80,62,35,.05);
  --sh-md:0 2px 6px rgba(80,62,35,.12),0 10px 24px rgba(80,62,35,.10);
  --r:16px;
  --sans:"HarmonyOS Sans SC","MiSans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",Georgia,serif;
  --mono:"SFMono-Regular","JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --g1:linear-gradient(135deg,#ff9a4d,var(--acc) 55%,#ad3c03);
  --gbd:linear-gradient(135deg,rgba(232,89,12,.95),rgba(255,196,140,.5),rgba(232,89,12,.3));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit;color:inherit}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c6ccd6;border:3px solid var(--paper);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

/* ================= 顶部导航 ================= */
.nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  padding:0 max(16px,env(safe-area-inset-left));
  height:58px;background:var(--card);
  border-bottom:1px solid var(--line);
  animation:navIn .5s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes navIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .logo{
  width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:var(--g1);
  border-radius:9px;box-shadow:0 3px 10px rgba(232,89,12,.45);
  animation:logoPulse 3.6s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{box-shadow:0 3px 10px rgba(232,89,12,.45);transform:rotate(0)}50%{box-shadow:0 3px 18px rgba(232,89,12,.75);transform:rotate(-6deg)}}
.brand .logo svg{width:16px;height:16px}
.brand .nm{
  font-family:var(--serif);font-size:19px;letter-spacing:.06em;
  background:linear-gradient(100deg,var(--ink) 0%,var(--ink) 40%,var(--acc) 50%,var(--ink) 60%,var(--ink) 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:titleSweep 7s linear infinite;
}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.login-btn{
  height:38px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;
  background:var(--g1);
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:7px;
  transition:box-shadow .2s,transform .12s;
  border:none;box-shadow:0 3px 12px rgba(232,89,12,.4);
  animation:loginIn .55s .18s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes loginIn{from{opacity:0;transform:translateX(20px) scale(.85)}to{opacity:1;transform:none}}
.login-btn::after{
  content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-20deg);animation:btnSheen 3.8s ease-in-out infinite;
}
@keyframes btnSheen{0%,68%{left:-70%}88%,100%{left:130%}}
.login-btn:active{transform:translateY(1px) scale(.97)}
.login-btn:hover{box-shadow:0 6px 22px rgba(232,89,12,.6)}
.login-btn.user{background:var(--card);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--sh)}
.login-btn.user::after{display:none}
.login-btn.user:hover{background:var(--paper);box-shadow:var(--sh-md)}
.login-btn .av{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:var(--acc);color:#fff;font-size:13px}
.login-btn .av img{width:100%;height:100%;object-fit:cover}
.login-btn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;position:relative;z-index:1}

/* ================= 搜索 Hero ================= */
.radio-hero{position:relative;isolation:isolate;overflow:hidden;padding:44px 20px 8px;text-align:center;transition:padding .45s}
.radio-hero::before,.radio-hero::after{
  content:"";position:absolute;width:44vmax;height:44vmax;border-radius:50%;
  filter:blur(64px);pointer-events:none;z-index:-1;will-change:transform;
}
.radio-hero::before{
  left:-12%;top:-38%;opacity:.34;
  background:radial-gradient(closest-side,rgba(232,89,12,.65),transparent);
  animation:driftA 17s ease-in-out infinite alternate;
}
.radio-hero::after{
  right:-14%;top:-26%;opacity:.26;
  background:radial-gradient(closest-side,rgba(123,47,191,.55),transparent);
  animation:driftB 21s ease-in-out infinite alternate;
}
@keyframes driftA{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(9vw,7vh,0) scale(1.16)}}
@keyframes driftB{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-8vw,10vh,0) scale(.92)}}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffb27d;opacity:0;pointer-events:none;animation:twinkle 3.4s ease-in-out infinite}
.star.dia{border-radius:1px;transform:rotate(45deg);width:5px;height:5px;background:var(--acc)}
.st1{left:9%;top:22%;animation-delay:.2s}
.st2{left:22%;top:64%;animation-delay:1.1s;width:3px;height:3px}
.st3{right:12%;top:30%;animation-delay:.7s;background:#c26a09}
.st4{right:24%;top:70%;animation-delay:1.7s;width:3px;height:3px}
.st5{left:48%;top:12%;animation-delay:2.2s;width:3px;height:3px;background:#e8a34d}
.st6{right:7%;top:56%;animation-delay:2.8s}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5) rotate(45deg)}50%{opacity:.95;transform:scale(1.35) rotate(45deg)}}
.rh-inner{max-width:640px;margin:0 auto;position:relative;transition:max-width .5s cubic-bezier(.22,.61,.36,1)}
.rh-twrap{max-height:150px;overflow:hidden;transition:max-height .5s cubic-bezier(.22,.61,.36,1),transform .5s cubic-bezier(.22,.61,.36,1)}
.rh-title{
  font-family:var(--serif);font-size:clamp(27px,4.8vw,40px);font-weight:700;letter-spacing:.04em;line-height:1.25;
  background-image:linear-gradient(100deg,var(--ink) 0%,var(--ink) 38%,var(--acc) 47%,#ff9a4d 53%,var(--ink) 62%,var(--ink) 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:titleIn .6s .12s cubic-bezier(.22,.61,.36,1) both,titleSweep 6.5s 1s linear infinite;
}
@keyframes titleIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes titleSweep{0%{background-position:130% 0}100%{background-position:-130% 0}}
.rh-search{
  margin:26px auto 0;max-width:520px;height:56px;display:flex;align-items:center;gap:8px;
  padding:0 8px 0 18px;border-radius:999px;background:var(--card);
  border:1.5px solid var(--line2);box-shadow:var(--sh-md);
  transition:box-shadow .25s,border-color .25s,transform .25s,max-width .5s cubic-bezier(.22,.61,.36,1),margin-top .45s;
  animation:searchIn .6s .3s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes searchIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.rh-search:focus-within{
  border-color:var(--acc);transform:translateY(-2px);
  box-shadow:0 0 0 5px rgba(232,89,12,.12),0 10px 30px rgba(232,89,12,.22);
  animation:searchPulse 2.2s ease-in-out infinite;
}
@keyframes searchPulse{0%,100%{box-shadow:0 0 0 5px rgba(232,89,12,.10),0 10px 30px rgba(232,89,12,.18)}50%{box-shadow:0 0 0 9px rgba(232,89,12,.05),0 12px 36px rgba(232,89,12,.28)}}
.rh-search svg{flex:none;color:var(--ink3);transition:color .2s,transform .3s}
.rh-search:focus-within svg{color:var(--acc);transform:rotate(-12deg) scale(1.1)}
.rh-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;padding:0 4px}
.rh-search .go{
  width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;background:var(--g1);
  box-shadow:0 4px 14px rgba(232,89,12,.5);
  transition:transform .18s,box-shadow .2s;position:relative;overflow:hidden;
}
.rh-search .go::after{
  content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);animation:btnSheen 3.2s ease-in-out infinite;
}
.rh-search .go:hover{transform:scale(1.1) rotate(8deg);box-shadow:0 7px 22px rgba(232,89,12,.65)}
.rh-search .go:active{transform:scale(.9)}
.rh-search .go svg{width:17px;height:17px;color:#fff;margin-left:1px}
/* —— 搜索模式：标题收起，搜索框上移展开 —— */
.radio-hero.searching{padding-top:26px}
.radio-hero.searching .rh-twrap{max-height:0;transform:translateY(-22px)}
.radio-hero.searching .rh-inner{max-width:820px}
.radio-hero.searching .rh-search{margin-top:14px;max-width:820px}

/* ================= 结果栏（搜索时显示） ================= */
.list-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:22px 16px 0;overflow:hidden;box-shadow:var(--sh);
  animation:cardDrop .45s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes cardDrop{from{opacity:0;transform:translateY(-16px) scale(.985)}to{opacity:1;transform:none}}
.list-card .hd{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.list-card .hd .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.list-card .hd .all{
  margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--acc);
  padding:8px 16px;border-radius:999px;background:var(--acc-l);transition:.18s;white-space:nowrap;position:relative;overflow:hidden;
}
.list-card .hd .all:hover{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(232,89,12,.4);transform:translateY(-1px)}
.list-card .hd .all:active{transform:scale(.95)}
.list-card .hd .all svg{width:14px;height:14px}
.songlist{list-style:none}
.songlist li{
  display:flex;align-items:center;gap:12px;padding:9px 18px;cursor:pointer;
  transition:background .14s,transform .18s;border-bottom:1px solid var(--line);
  animation:listIn .4s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes listIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.songlist li:last-child{border-bottom:none}
.songlist li:hover{background:var(--paper);transform:translateX(5px)}
.songlist li:active{transform:translateX(5px) scale(.995)}
.songlist li.cur{background:var(--acc-l)}
.songlist .idx{width:22px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink3);flex:none}
.songlist li .im{width:42px;height:42px;border-radius:10px;overflow:hidden;position:relative;flex:none;background:var(--acc-l)}
.songlist li .im img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.songlist li:hover .im img{transform:scale(1.12) rotate(-3deg)}
.songlist li .im .eq{position:absolute;inset:0;display:none;align-items:center;gap:2px;justify-content:center;background:rgba(15,23,42,.38)}
.songlist li.cur .im .eq{display:flex}
.songlist li .im .eq i{width:3px;background:#fff;animation:eq 1s ease-in-out infinite}
.songlist li .im .eq i:nth-child(2){animation-delay:.25s}
.songlist li .im .eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:6px}50%{height:16px}}
body.paused .songlist li.cur .eq i{animation-play-state:paused}
.songlist .meta{flex:1;min-width:0}
.songlist .meta .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.songlist li.cur .meta .t{color:var(--acc)}
.songlist .meta .s{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.songlist .empty{padding:44px 16px;text-align:center;font-size:13px;color:var(--ink3);justify-content:center}

/* ================= 底部播放器 ================= */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:#1d1a15;
  border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -6px 28px rgba(20,15,8,.22);
  padding-bottom:env(safe-area-inset-bottom);
  animation:playerIn .6s .35s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes playerIn{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
/* 进度条（主播放器 + 歌词页共用） */
.prog{position:relative;cursor:pointer;touch-action:none;user-select:none;transition:height .15s;background:rgba(255,255,255,.18)}
.prog .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff9a4d,var(--acc));width:0%;transition:width .2s linear}
.prog .knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 0 8px rgba(232,89,12,.75);transform:translate(-50%,-50%) scale(0);transition:transform .15s}
.prog:hover .knob,.prog.drag .knob{transform:translate(-50%,-50%) scale(1)}
.p-prog{height:4px;background:rgba(255,255,255,.16)}
.p-prog:hover{height:7px}
.p-main{display:flex;align-items:center;gap:14px;padding:8px 16px;height:var(--player-h)}
.p-cov{position:relative;flex:none;width:54px;height:54px;border-radius:var(--r);overflow:hidden;background:rgba(255,255,255,.1);cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:transform .25s}
.p-cov:hover{transform:scale(1.07) rotate(-3deg)}
.p-cov img{width:100%;height:100%;object-fit:cover}
.p-cov .mask{position:absolute;inset:0;background:rgba(13,11,8,.5);display:none;align-items:center;justify-content:center;color:#fff}
.p-cov.live .mask{display:flex}
.p-cov.live{animation:coverGlow 2.2s ease-in-out infinite}
@keyframes coverGlow{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,.4),0 0 0 0 rgba(232,89,12,.55)}50%{box-shadow:0 4px 16px rgba(0,0,0,.4),0 0 0 7px rgba(232,89,12,0)}}
.p-cov .mask svg{width:22px;height:22px}
.p-now{flex:1;min-width:0;cursor:pointer;transition:transform .2s}
.p-now:hover{transform:translateX(3px)}
.p-now .t{font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;min-height:20px}
.p-now .s{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;letter-spacing:.02em;min-height:14px}
.p-ctrl{display:flex;align-items:center;gap:6px;flex:none}
/* —— 渐变描边按钮基类（切歌/播放/播放方式/播放列表共用） —— */
.gb{
  position:relative;overflow:hidden;color:#ffc9a1;flex:none;
  background:linear-gradient(var(--fill,#2b2117),var(--fill,#2b2117)) padding-box,var(--gbd) border-box;
  border:1.5px solid transparent;
  display:flex;align-items:center;justify-content:center;text-align:center;
  transition:transform .18s,box-shadow .22s,color .2s;
}
.gb::after{
  content:"";position:absolute;top:0;left:-75%;width:50%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.32),transparent);
  transform:skewX(-20deg);transition:left .45s ease;
}
.gb:hover{color:#fff;box-shadow:0 9px 24px rgba(232,89,12,.45),inset 0 1px 0 rgba(255,255,255,.1)}
.gb:hover::after{left:130%}
.gb:active{transform:scale(.86)}
/* 主播放器：上/下曲 + 播放键 */
.p-ctrl button.skip{--fill:#262019;width:46px;height:44px;border-radius:15px;box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
.p-ctrl button.skip svg{width:20px;height:20px}
#btnPrev:hover,#btnLyrPrev:hover{transform:translateY(-3px) rotate(-9deg) scale(1.06)}
#btnNext:hover,#btnLyrNext:hover{transform:translateY(-3px) rotate(9deg) scale(1.06)}
.p-ctrl .play{--fill:#2b2117;width:58px;height:54px;margin:0 4px;border-radius:17px;box-shadow:0 5px 18px rgba(0,0,0,.45),0 0 22px rgba(232,89,12,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.p-ctrl .play:hover{transform:scale(1.08);box-shadow:0 9px 26px rgba(0,0,0,.5),0 0 32px rgba(232,89,12,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.p-ctrl .play:active{transform:scale(.9)}
.p-ctrl .play svg{width:26px;height:26px;margin-left:2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.p-ctrl .play.on{animation:playBreath 2.4s ease-in-out infinite}
@keyframes playBreath{
  0%,100%{box-shadow:0 5px 18px rgba(0,0,0,.45),0 0 16px rgba(232,89,12,.3),inset 0 1px 0 rgba(255,255,255,.08)}
  50%{box-shadow:0 5px 18px rgba(0,0,0,.45),0 0 36px rgba(232,89,12,.62),inset 0 1px 0 rgba(255,255,255,.12)}
}
.p-side{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end}
.p-side .tm{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.55);padding-left:8px;letter-spacing:.02em}
@media (max-width:560px){
  .p-ctrl .play{width:46px;height:46px}
  .p-ctrl button.skip{width:40px;height:40px;border-radius:13px}
  .p-side .tm{font-size:10px}
}

/* ================= 全页面歌词栏（左图右词） ================= */
.lyr{position:fixed;inset:0;z-index:90;display:none;background:#101014;overflow:hidden;flex-direction:column}
.lyr.on{display:flex;animation:lyrIn .3s ease}
@keyframes lyrIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.lyr .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) brightness(.42) saturate(.9);transform:scale(1.05);animation:bgDrift 26s ease-in-out infinite alternate}
@keyframes bgDrift{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,1.5%)}}
.lyr .scrim{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(8,8,11,.82) 0%,rgba(8,8,11,.3) 28%,rgba(8,8,11,.36) 58%,rgba(8,8,11,.9) 100%)}
.lyr .top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff}
.lyr .top .tt{flex:1;min-width:0}
.lyr .top .tt b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.04em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr .top .tt span{font-family:var(--mono);font-size:11px;opacity:.65;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;letter-spacing:.04em}
.lyr .close{position:relative;z-index:2;margin-left:6px;width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);transition:.2s;overflow:hidden}
.lyr .close:hover{background:rgba(255,255,255,.3);transform:rotate(180deg)}
/* 左图右词主体 */
.lyr-body{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;gap:30px;align-items:stretch;padding:6px 36px 0}
.lyr-art{position:relative;z-index:0;flex:none;width:min(36vh,300px);align-self:center;animation:artIn .65s .1s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes artIn{from{opacity:0;transform:translateX(-46px) rotate(-8deg) scale(.86)}to{opacity:1;transform:none}}
.lyr-art::before{
  content:"";position:absolute;inset:-13px;border-radius:32px;z-index:-1;opacity:.6;
  background:conic-gradient(from 0deg,rgba(232,89,12,.85),rgba(255,178,125,.25),rgba(123,47,191,.5),rgba(232,89,12,.85));
  filter:blur(7px);animation:ringSpin 7s linear infinite;
}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.lyr-art img{
  width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px;
  box-shadow:0 24px 70px rgba(0,0,0,.65);
  animation:artFloat 5.6s ease-in-out infinite;position:relative;
}
@keyframes artFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-13px) rotate(1.5deg)}}
.lyr-art::after{
  content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.42) 46%,transparent 60%);
  background-size:260% 100%;animation:sheen 4.6s ease-in-out infinite;
}
@keyframes sheen{0%,60%{background-position:170% 0}88%,100%{background-position:-90% 0}}
.lyr-art.playing::before{animation-duration:3.4s;opacity:.85}
.lyr .lrc-box{
  position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);
}
.lyr .lrc-wrap{position:relative;height:100%}
.lyr .lrc-tr{position:relative;text-align:left;transition:transform .55s cubic-bezier(.22,.61,.36,1)}
.lyr .l-line{padding:7px 8px;font-family:var(--sans);font-size:14.5px;color:rgba(255,255,255,.4);transition:transform .35s,opacity .35s,color .35s,letter-spacing .35s;cursor:pointer;line-height:1.55;word-break:break-word;letter-spacing:.02em;animation:lineIn .45s cubic-bezier(.22,.61,.36,1) both}
@keyframes lineIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.lyr .l-line:hover{color:rgba(255,255,255,.75)}
.lyr .l-line.acti{
  color:#fff;font-size:19px;font-weight:700;font-family:var(--serif);
  transform:translateX(14px);letter-spacing:.04em;
  text-shadow:0 3px 26px rgba(0,0,0,.55),0 0 24px rgba(232,89,12,.35);
  padding:13px 8px;
  border-left:3px solid var(--acc);
}
.lyr .lyr-prog{z-index:2;height:3px;margin:10px 36px 8px}
.lyr .lyr-prog:hover{height:6px}
.lyr .bottom{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 16px 26px;animation:fadeUp .5s .22s cubic-bezier(.22,.61,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lyr .lyr-time{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.5);text-align:center;letter-spacing:.05em;margin:-6px 0 4px;animation:fadeUp .5s .22s cubic-bezier(.22,.61,.36,1) both}
/* 底部三段式：左空白 / 播放簇居中 / 方式+列表靠右 */
.lyr .bottom .b-l{flex:1}
.lyr .bottom .b-r{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:16px}
.lyr .bottom .b-m{flex:none;display:flex;align-items:center;gap:16px}
/* 歌词页控制钮：上/下曲 + 播放键 + 播放方式 + 播放列表 */
.lyr .bottom .skip{--fill:rgba(255,255,255,.08);width:52px;height:50px;border-radius:16px;box-shadow:0 5px 18px rgba(0,0,0,.45)}
.lyr .bottom .skip svg{width:22px;height:22px}
.lyr .bottom .play{--fill:#2b2117;width:70px;height:64px;border-radius:21px;box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 26px rgba(232,89,12,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.lyr .bottom .play:hover{transform:scale(1.08);box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 40px rgba(232,89,12,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.lyr .bottom .play:active{transform:scale(.9)}
.lyr .bottom .play svg{width:30px;height:30px;margin-left:2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.lyr .bottom .play.on{animation:playBreath 2.4s ease-in-out infinite}
.lyr .bottom .mode{--fill:#2b2117;width:50px;height:50px;border-radius:16px}
.lyr .bottom .mode svg{width:20px;height:20px}
.lyr .bottom .qbtn{--fill:#2b2117;width:50px;height:50px;border-radius:16px}
.lyr .bottom .qbtn svg{width:20px;height:20px}
.lyr .bottom .qbtn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(232,89,12,.4)}
.lyr-queue{
  position:absolute;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:4;
  width:min(340px,88vw);max-height:54%;display:none;flex-direction:column;
  background:rgba(24,21,30,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14);border-radius:18px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.lyr-queue.on{display:flex;animation:queueIn .28s cubic-bezier(.22,.61,.36,1)}
@keyframes queueIn{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
.lyr-queue .qh{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:13px}
.lyr-queue .qh .n{font-family:var(--mono);font-size:11px;opacity:.6;font-weight:400}
.lyr-queue .qh .x{margin-left:auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);transition:.15s}
.lyr-queue .qh .x:hover{background:rgba(255,255,255,.14);color:#fff}
.lyr-queue ol{list-style:none;overflow-y:auto;padding-bottom:6px}
.lyr-queue li{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);transition:background .15s}
.lyr-queue li:last-child{border-bottom:none}
.lyr-queue li:hover{background:rgba(255,255,255,.08)}
.lyr-queue li.cur{background:rgba(232,89,12,.16)}
.lyr-queue li .t{flex:1;min-width:0;font-size:13px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr-queue li.cur .t{color:#ffb27d;font-weight:600}
.lyr-queue li .a{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.45);flex:none;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){
  .lyr-body{gap:14px;padding:4px 14px 0}
  .lyr-art{width:min(28vh,150px)}
  .lyr .l-line{font-size:13.5px}
  .lyr .l-line.acti{font-size:16.5px;padding:10px 6px}
  .lyr .lyr-prog{margin:8px 16px}
  .lyr .bottom{gap:10px}
  .lyr .bottom .b-m{gap:8px}
  .lyr .bottom .b-r{gap:10px}
  .lyr .bottom .mode,.lyr .bottom .qbtn{width:40px;height:40px}
  .lyr .lyr-time{margin:-4px 0 2px;font-size:10px}
}

/* ================= 登录面板 ================= */
.mask-layer{position:fixed;inset:0;background:rgba(31,35,40,.45);z-index:120;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.mask-layer.on{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{position:relative;width:min(390px,100%);background:var(--card);border-radius:calc(var(--r) + 6px);overflow:hidden;box-shadow:0 24px 60px rgba(31,35,40,.3);animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
.panel::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:3;
  background:linear-gradient(90deg,var(--acc),#ff9a4d,#a7770a,#7b2fbe,var(--acc));
  background-size:220% 100%;animation:barSlide 3.4s linear infinite;
}
@keyframes barSlide{to{background-position:-220% 0}}
.panel .ph{display:flex;align-items:center;gap:10px;padding:19px 20px 6px}
.panel .ph b{font-family:var(--sans);font-size:16px;letter-spacing:.02em}
.panel .ph .x{margin-left:auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:.2s}
.panel .ph .x:hover{background:var(--paper);color:var(--acc);transform:rotate(90deg)}
.panel .pd{display:flex;flex-direction:column;gap:8px;padding:14px 20px 20px}
.pv{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.18s;animation:pvIn .4s cubic-bezier(.22,.61,.36,1) both}
.pv:nth-child(2){animation-delay:.06s}
.pv:nth-child(3){animation-delay:.12s}
.pv:nth-child(4){animation-delay:.18s}
@keyframes pvIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.pv:hover{border-color:var(--acc);background:var(--acc-l);transform:translateX(5px);box-shadow:0 4px 14px rgba(232,89,12,.14)}
.pv .lg{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;font-family:var(--sans);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.pv .nm{flex:1;font-size:14px;font-weight:600}
.pv .arr{font-size:16px;color:var(--ink3);transition:transform .18s}
.pv:hover .arr{transform:translateX(5px);color:var(--acc)}
.profile{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--line2);border-radius:12px;animation:pvIn .4s both}
.profile .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--sans);font-size:17px;font-weight:700}
.profile .av img{width:100%;height:100%;object-fit:cover}
.profile .nm{font-weight:600;font-size:14.5px}
.profile .em{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:2px;word-break:break-all}

/* ================= 全设备自适应 =================
   基于实际设备尺寸自动调整排版与样式：
   宽屏桌面 / 平板 / 手机竖屏 / 超小屏 / 横屏矮屏 / 减少动效 */
.lyr{height:100dvh}
@media (max-width:900px){
  .radio-hero{padding:34px 14px 6px}
  .list-card{margin:16px 12px 0}
  .lyr-body{padding:6px 18px 0;gap:20px}
  .lyr-art{width:min(32vh,240px)}
}
@media (max-width:720px){
  .brand .nm{font-size:16px}
  .radio-hero{padding:26px 10px 4px}
  .rh-title{font-size:clamp(22px,6.4vw,30px)}
  .rh-search{height:50px;margin-top:18px;padding-left:14px}
  .rh-search input{font-size:14px}
  .rh-search .go{width:36px;height:36px}
  .login-btn{padding:0 14px}
  .list-card{margin:12px 10px 0}
  .list-card .hd{padding:10px 12px}
  .list-card .hd .all{padding:7px 12px;font-size:12px}
  .songlist li{padding:8px 12px;gap:10px}
  .songlist .idx{width:18px;font-size:11px}
  .songlist .im{width:38px;height:38px;border-radius:9px}
  /* 歌词页：竖屏改上下布局（封面上、歌词下），安全区适配 */
  .lyr .top{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .lyr-body{flex-direction:column;align-items:center;gap:12px;padding:2px 14px 0}
  .lyr-art{width:min(24vh,132px)}
  .lyr .lrc-box{width:100%}
}
@media (max-width:480px){
  .brand .nm{display:none}
  .login-btn{padding:0 13px}
  .login-btn .nm{max-width:96px}
  .login-btn .av{width:24px;height:24px}
  .p-cov{width:46px;height:46px;border-radius:13px}
  .p-main{gap:10px;padding:6px 10px}
  .p-now .t{font-size:13px}
  .p-now .s{font-size:9.5px}
  .p-side .tm{display:none}
}
@media (max-height:520px) and (orientation:landscape){
  /* 横屏矮屏：歌词页回到左右布局，封面缩小、控件紧凑 */
  .lyr-body{flex-direction:row;align-items:center;padding:0 16px;gap:18px}
  .lyr-art{width:min(18vh,118px)}
  .lyr .lrc-box{width:auto;flex:1 1 auto}
  .lyr .lyr-prog{margin:6px 18px 4px}
  .lyr .bottom{padding-top:2px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>

<body>

(function () {

/* 次元星域音乐 —— 仅搜索 / 登录 / 歌词 / 播放 */

var S = { server: "netease", list: [], idx: -1, lrc: [], lrcIdx: -1, mode: 0 };
var MODE_ICONS = [

function apiUrl(type, id) {

function $(id) { return document.getElementById(id); }

}
function hash(s) {
  var h = 0, i, c;
  for (i = 0; i < s.length; i++) { c = s.charCodeAt(i); h = ((h << 5) - h + c) | 0; }
  return Math.abs(h).toString(36);
}
function picToHttps(p) { return String(p || "").replace(/^http:/, "https:"); }
function idFromUrl(u) {
  var s = String(u || "");
  var i = s.indexOf("id=");
  if (i < 0) return "";
  return s.slice(i + 3).replace(/[^0-9].*$/, "");
}
function mapItem(raw, i) {
  raw = raw || {};
  var id = raw.id ? String(raw.id) : "";
  if (!id) id = idFromUrl(raw.url || raw.lrc || raw.pic);
  if (!id) id = "t" + hash(String(raw.title || "") + "|" + String(raw.author || "") + "|" + i);
  return {
    id: id,
    title: String(raw.title || raw.name || raw.song || ""),
    author: String(raw.author || raw.artist || raw.singer || ""),
    pic: picToHttps(raw.pic || raw.cover || raw.picUrl || "")
  };
}
function toList(data) {
  var arr = Array.isArray(data) ? data : ((data && data.data) || []);
  var out = [];
  for (var i = 0; i < arr.length; i++) out.push(mapItem(arr[i], i));
  return out;
}
function getJSON(url, tries) {
  tries = (tries == null) ? 1 : tries;
  var ctrl = new AbortController();
  var timer = window.setTimeout(function () { ctrl.abort(); }, 6000);
  return fetch(url, { signal: ctrl.signal }).then(function (r) {
    window.clearTimeout(timer);
    return r.json();
  }).catch(function (err) {
    window.clearTimeout(timer);
    if (tries > 0) {
      return new Promise(function (res) { setTimeout(res, 400); }).then(function () { return getJSON(url, tries - 1); });
    }
    throw err;
  });
}
function escText(s) {
  return String(s == null ? "" : s).replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escAttr(s) { return escText(s).replace(/"/g, "&quot;"); }
function imgFallback(img) {
  img.onerror = function () { this.onerror = null; this.src = DEFAULT_ART; };
}

/* ---------- 搜索（输入即搜，结果栏随搜索显隐） ---------- */
var searchTimer = null;
var SEARCH_CACHE = {};
function runSearch() {
  var q = $("kw").value.trim();
  $("radioHero").classList.toggle("searching", q.length > 0);
  var card = $("listCard");
  if (!q) { card.style.display = "none"; return; }
  card.style.display = "";
  var ul = $("searchList");
  var got = SEARCH_CACHE[q];
  if (got && got.expire > Date.now()) {
    S.list = got.list.slice();
    S.idx = -1;
    $("resCount").textContent = got.list.length ? got.list.length + " 首" : "";
    renderSonglist(ul, S.list);
  } else {
    ul.innerHTML = '<li class="empty">搜索中…</li>';
    $("resCount").textContent = "";
  }
  getJSON(apiUrl("search", q), 2).then(function (data) {
    var list = toList(data);
    var keys = Object.keys(SEARCH_CACHE);
    if (keys.length >= 20) delete SEARCH_CACHE[keys[0]];
    SEARCH_CACHE[q] = { list: list.slice(), expire: Date.now() + 5 * 60 * 1000 };
    if ($("kw").value.trim() === q) {
      S.list = list;
      S.idx = -1;
      $("resCount").textContent = list.length ? list.length + " 首" : "";
      renderSonglist(ul, list);
    }
  }).catch(function () {
    if (!ul.children.length) ul.innerHTML = "";
    $("resCount").textContent = "";
  });
}
function renderSonglist(ul, list) {
  ul.innerHTML = "";
  if (!list.length) {
    ul.innerHTML = '<li class="empty">没有结果</li>';
    return;
  }
  for (var i = 0; i < list.length; i++) {
    (function (it, idx) {
      var li = document.createElement("li");
      if (idx === S.idx) li.className = "cur";
      li.style.animationDelay = Math.min(idx * 0.03, 0.6) + "s";
      li.innerHTML =
        '<span class="idx">' + (idx + 1) + '</span>' +
        '<span class="im"><img src="' + escAttr(it.pic) + '" loading="lazy" decoding="async" alt="">' +
        '<span class="eq"><i></i><i></i><i></i></span></span>' +
        '<div class="meta"><div class="t">' + escText(it.title) + '</div><div class="s">' + escText(it.author) + '</div></div>';
      li.onclick = function () { playFromList(list, idx); };
      imgFallback(li.querySelector("img"));
      ul.appendChild(li);
    })(list[i], i);
  }
}

/* ---------- 播放 ---------- */
function setQueue(list, idx) {
  S.list = list.slice();
  S.idx = -1;
  renderQueue();
  playItem(idx);
}
function playFromList(list, idx) {
  S.list = list.slice();
  renderQueue();
  playItem(idx);
  highlightLists();
}
function onPlayFail(err) {
  var now = Date.now();
  if (S.failAt && now - S.failAt < 1500) return;
  S.failAt = now;
  if (err && err.name === "NotAllowedError") { setPlaying(false); return; }
  setPlaying(false);
  var hadSrc = !!audio.src;
  audio.removeAttribute("src");
  try { audio.load(); } catch (e) {}
  if (hadSrc && S.list.length > 1) {
    S.failGuard = (S.failGuard || 0) + 1;
    if (S.failGuard <= 2) {
      var next = S.idx + 1;
      if (next >= S.list.length) next = 0;
      setTimeout(function () { playItem(next); }, 1200);
      return;
    }
  }
  S.failGuard = 0;
}
function playItem(i) {
  var it = S.list[i];
  if (!it) return;
  S.idx = i;
  S.lrc = [];
  S.lrcIdx = -1;
  $("nowTitle").textContent = it.title;
  $("nowAuthor").textContent = it.author;
  var cov = it.pic ? coverUrl(it.id) : DEFAULT_ART;
  $("coverImg").src = cov;
  $("lyrImg").src = cov;
  $("lyrBg").style.backgroundImage = "url('" + cov + "')";
  imgFallback($("coverImg"));
  imgFallback($("lyrImg"));
  audio.src = streamUrl(it.id);
  audio.play().then(function () { setPlaying(true); }).catch(function (err) { onPlayFail(err); });
  loadLrc(it.id);
  highlightLists();
  $("coverBtn").classList.add("live");
}
function highlightLists() {
  var lis = $("searchList").children;
  for (var i = 0; i < lis.length; i++) lis[i].classList.toggle("cur", i === S.idx);
  var ql = $("qlBody").children;
  for (var j = 0; j < ql.length; j++) ql[j].classList.toggle("cur", j === S.idx);
}
function setPlaying(on) {
  var ic = on ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $("playIcon").innerHTML = ic;
  $("lyrPlayIcon").innerHTML = ic;
  $("coverMask").innerHTML = ic;
  $("btnPlay").classList.toggle("on", on);
  $("btnLyrPlay").classList.toggle("on", on);
  $("lyrArt").classList.toggle("playing", on);
  document.body.classList.toggle("paused", !on);
}

/* ---------- 播放列表 / 播放方式 ---------- */
function renderQueue() {
  var ol = $("qlBody");
  ol.innerHTML = "";
  $("qlCount").textContent = S.list.length ? "· " + S.list.length : "";
  for (var i = 0; i < S.list.length; i++) {
    (function (it, idx) {
      var li = document.createElement("li");
      if (idx === S.idx) li.className = "cur";
      li.innerHTML =
        '<span class="t">' + escText(it.title) + '</span><span class="a">' + escText(it.author) + '</span>';
      li.onclick = function () { playFromList(S.list, idx); };
      ol.appendChild(li);
    })(S.list[i], i);
  }
}
/* ---------- 歌词 ---------- */
function loadLrc(id) {
  $("lyrTr").innerHTML = "";
  fetch(lrcUrl(id)).then(function (r) { return r.text(); }).then(function (txt) {
    S.lrc = parseLrc(txt);
    renderLrc();
  }).catch(function () {
    S.lrc = [];
    $("lyrTr").innerHTML = "";
  });
}
function parseLrc(text) {
  var rows = [];
  var lines = String(text || "").split(String.fromCharCode(10));
  var i, j, line, rest, times, tag, p, mm, ss, content;
  for (i = 0; i < lines.length; i++) {
    line = lines[i].trim();
    if (!line) continue;
    times = [];
    rest = line;
    while (rest.charAt(0) === "[") {
      var end = rest.indexOf("]");
      if (end < 0) break;
      tag = rest.slice(1, end);
      p = tag.indexOf(":");
      if (p <= 0) break;
      mm = Number(tag.slice(0, p));
      ss = Number(tag.slice(p + 1).replace(",", "."));
      if (!isFinite(mm) || !isFinite(ss)) break;
      times.push(mm * 60 + ss);
      rest = rest.slice(end + 1);
    }
    content = rest.trim() || "♪";
    if (times.length) {
      for (j = 0; j < times.length; j++) rows.push({ t: times[j], c: content });
    } else if (content !== "♪") {
      rows.push({ t: -1, c: content });
    }
  }
  rows.sort(function (a, b) { return a.t - b.t; });
  var out = [], cur, nxt;
  for (i = 0; i < rows.length; i++) {
    cur = rows[i];
    nxt = rows[i + 1];
    if (nxt && cur.t >= 0 && Math.abs(nxt.t - cur.t) < 0.5 && cur.c !== nxt.c && cur.c !== "♪" && nxt.c !== "♪") {
      out.push({ t: cur.t, c: cur.c, tl: nxt.c });
      i++;
    } else {
      out.push({ t: cur.t, c: cur.c, tl: "" });
    }
  }
  return out;
}
function renderLrc() {
  var tr = $("lyrTr");
  tr.innerHTML = "";
  tr.style.transform = "translateY(0px)";
  if (!S.lrc.length) return;
  for (var i = 0; i < S.lrc.length; i++) {
    (function (it, idx) {
      var d = document.createElement("div");
      d.className = "l-line" + (idx === S.lrcIdx ? " acti" : "");
      d.style.animationDelay = Math.min(idx * 0.02, 0.5) + "s";
      d.textContent = it.c;
      if (it.tl) {
        var s2 = document.createElement("div");
        s2.style.fontSize = ".72em";
        s2.style.opacity = ".75";
        s2.textContent = it.tl;
        d.appendChild(s2);
      }
      d.onclick = function () { if (it.t >= 0 && isFinite(audio.duration) && audio.duration) audio.currentTime = it.t; };
      tr.appendChild(d);
    })(S.lrc[i], i);
  }
  scrollLrc();
}
function scrollLrc() {
  var wrap = document.querySelector(".lrc-wrap");
  var tr = $("lyrTr");
  var kids = tr.children;
  if (!kids.length || S.lrcIdx < 0 || S.lrcIdx >= kids.length) return;
  var boxH = wrap.clientHeight || 320;
  var el = kids[S.lrcIdx];
  var target = el.offsetTop + el.offsetHeight / 2;
  var off = Math.round(boxH / 2 - target);
  tr.style.transform = "translateY(" + Math.max(off, -el.offsetTop) + "px)";
}
function updateLrc() {
  if (!S.lrc.length) return;
  var t = audio.currentTime, idx = -1;
  for (var i = S.lrc.length - 1; i >= 0; i--) {
    if (S.lrc[i].t >= 0 && S.lrc[i].t <= t) { idx = i; break; }
  }
  if (idx === S.lrcIdx) return;
  S.lrcIdx = idx;
  var kids = $("lyrTr").children;
  for (var j = 0; j < kids.length; j++) kids[j].classList.toggle("acti", j === idx);
  scrollLrc();
}

/* ---------- 进度/时间 ---------- */
function onTime() {
  var d = isFinite(audio.duration) ? audio.duration : 0;
  var pct = d ? (audio.currentTime / d * 100) : 0;
  $("progFill").style.width = pct + "%";
  $("prog").querySelector(".knob").style.left = pct + "%";
  $("lyrProgFill").style.width = pct + "%";
  $("lyrProg").querySelector(".knob").style.left = pct + "%";
  $("curTime").textContent = fmt(audio.currentTime);
  $("durTime").textContent = fmt(d);
  $("lyrCur").textContent = fmt(audio.currentTime);
  $("lyrDur").textContent = fmt(d);
  updateLrc();
}
function bindSeek(bar, fillId, knobSel) {
  var dragging = false;
  function pos(e) {
    var r = bar.getBoundingClientRect();
    var x = e.clientX - r.left;
    return Math.max(0, Math.min(1, x / r.width));
  }
  function seekTo(p) {
    if (isFinite(audio.duration) && audio.duration) audio.currentTime = p * audio.duration;
  }
  bar.addEventListener("pointerdown", function (e) {
    dragging = true;
    bar.classList.add("drag");
    bar.setPointerCapture(e.pointerId);
    seekTo(pos(e));
  });
  bar.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var p = pos(e);
    $(fillId).style.width = (p * 100) + "%";
    bar.querySelector(knobSel).style.left = (p * 100) + "%";
    seekTo(p);
  });
  bar.addEventListener("pointerup", function () { dragging = false; bar.classList.remove("drag"); });
  bar.addEventListener("pointercancel", function () { dragging = false; bar.classList.remove("drag"); });
}
function onEnded() {
  if (S.mode === 2) { audio.currentTime = 0; audio.play(); return; }
  if (S.idx < S.list.length - 1) { playItem(S.idx + 1); return; }
  if (S.mode === 1) { playItem(0); return; }
  setPlaying(false);
}

/* ---------- 歌词栏 ---------- */
function openLyrics() {
  if (!S.list.length || S.idx < 0) return;
  $("lyrView").classList.add("on");
  $("lyrTitle").textContent = $("nowTitle").textContent;
  $("lyrAuthor").textContent = $("nowAuthor").textContent;
  window.setTimeout(scrollLrc, 80);
}
function closeLyrics() { $("lyrView").classList.remove("on"); }

/* ---------- 登录 ---------- */
var LOGIN_HOST = "https://oauth.107211.xyz";
var OAUTH_PROVIDERS = [
  { id: "github", name: "GitHub", color: "#24292f", letter: "GH" },
  { id: "microsoft", name: "Microsoft", color: "#00a4ef", letter: "MS" },
  { id: "twitter", name: "Twitter / X", color: "#1da1f2", letter: "X" },
  { id: "gitlab", name: "GitLab", color: "#fc6d26", letter: "GL" },
  { id: "qq", name: "QQ", color: "#12b7f5", letter: "Q" }
];
var OAUTH_PROVIDERS_LOADED = false;
function loadProviders() {
  if (OAUTH_PROVIDERS_LOADED) return;
  OAUTH_PROVIDERS_LOADED = true;
  getJSON(LOGIN_HOST + "/api/providers", 0).then(function (data) {
    var arr = data && data.providers;
    if (!Array.isArray(arr) || !arr.length) return;
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var p = arr[i];
      if (!p || !p.id) continue;
      out.push({
        id: p.id,
        name: p.label || p.id,
        color: p.color || "#222",
        letter: (p.icon || p.id).slice(0, 2).toUpperCase()
      });
    }
    if (out.length) OAUTH_PROVIDERS = out;
  }).catch(function () {});
}
function currentUser() {
  try { return JSON.parse(localStorage.getItem("mus_user") || "null"); } catch (e) { return null; }
}
function saveUser(u) {
  try { localStorage.setItem("mus_user", JSON.stringify(u)); } catch (e) {}
}
function clearUser() {
  try { localStorage.removeItem("mus_user"); } catch (e) {}
}
function renderUser(u) {
  var btn = $("btnLogin");
  if (u && u.name) {
    btn.classList.add("user");
    btn.innerHTML =
      '<span class="av">' + (u.avatar ? '<img src="' + escAttr(u.avatar) + '" alt="">' : escText((u.name || "?").charAt(0))) + '</span>' +
      '<span class="nm">' + escText(u.name) + '</span>';
    var av = btn.querySelector("img");
    if (av) imgFallback(av);
  } else {
    btn.classList.remove("user");
    btn.textContent = "登录";
  }
}
function openLogin() {
  $("loginLayer").classList.add("on");
  var u = currentUser();
  var box = $("providerList");
  box.innerHTML = "";
  $("loginTitle").textContent = u && u.name ? "已登录" : "登录";
  if (u && u.name) {
    var pf = document.createElement("div");
    pf.className = "profile";
    pf.innerHTML =
      '<span class="av">' + (u.avatar ? '<img src="' + escAttr(u.avatar) + '" alt="">' : escText((u.name || "?").charAt(0))) + '</span>' +
      '<div><div class="nm">' + escText(u.name) + '</div>' +
      (u.email ? '<div class="em">' + escText(u.email) + '</div>' : '') +
      (u.provider ? '<div class="em">via ' + escText(u.provider) + '</div>' : '') +
      '</div>';
    var pav = pf.querySelector("img");
    if (pav) imgFallback(pav);
    box.appendChild(pf);
    var lo = document.createElement("div");
    lo.className = "pv";
    lo.innerHTML = '<span class="lg" style="background:#8a9098">↪</span><span class="nm">退出登录</span><span class="arr">›</span>';
    lo.onclick = function () { doLogout(); };
    box.appendChild(lo);
  } else {
    loadProviders();
    OAUTH_PROVIDERS.forEach(function (p) {
      var d = document.createElement("div");
      d.className = "pv";
      d.innerHTML = '<span class="lg" style="background:' + p.color + '">' + p.letter + '</span><span class="nm">' + p.name + '</span><span class="arr">›</span>';
      d.onclick = function () {
        location.href = LOGIN_HOST + "/auth/" + p.id + "?ref=" + encodeURIComponent(location.href);
      };
      box.appendChild(d);
    });
  }
}
function closeLogin() { $("loginLayer").classList.remove("on"); }
function doLogout() {
  clearUser();
  closeLogin();
  renderUser(null);
}
function parseLoginReturn() {
  var q = new URLSearchParams(location.search);
  if (q.get("oauth_success") === "1") {
    saveUser({
      name: q.get("name") || "用户",
      username: q.get("username") || "",
      email: q.get("email") || "",
      avatar: q.get("avatar") || "",
      provider: q.get("provider") || "",
      at: Date.now()
    });
    renderUser(currentUser());
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.hash);
  } else {
    renderUser(currentUser());
  }
}

/* ---------- 事件 ---------- */
$("kw").addEventListener("input", function () {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  $("radioHero").classList.toggle("searching", q.length > 0);
  if (!q) { $("listCard").style.display = "none"; return; }
  searchTimer = setTimeout(runSearch, 180);
});
$("kw").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { clearTimeout(searchTimer); runSearch(); }
});
$("btnDoSearch").onclick = function () { clearTimeout(searchTimer); runSearch(); };
$("playAll").onclick = function () { if (S.list.length) setQueue(S.list, 0); };

function clickPlay() {
  if (!audio.src) { if (S.list.length) playItem(0); return; }
  if (audio.paused) audio.play(); else audio.pause();
}
function stepPrev() { if (S.list.length) playItem(S.idx > 0 ? S.idx - 1 : S.list.length - 1); }
function stepNext() { if (S.list.length) playItem(S.idx < S.list.length - 1 ? S.idx + 1 : 0); }
$("btnPlay").onclick = clickPlay;
$("btnLyrPlay").onclick = clickPlay;
$("btnPrev").onclick = stepPrev;
$("btnLyrPrev").onclick = stepPrev;
$("btnNext").onclick = stepNext;
$("btnLyrNext").onclick = stepNext;
$("btnLyrMode").onclick = function () { S.mode = (S.mode + 1) % 3; $("lyrModeIcon").innerHTML = MODE_ICONS[S.mode]; };
$("btnLyrQueue").onclick = function () { $("lyrQueue").classList.toggle("on"); };
$("btnLyrQueueClose").onclick = function () { $("lyrQueue").classList.remove("on"); };
$("coverBtn").onclick = openLyrics;
$("nowBtn").onclick = openLyrics;
$("btnLyrClose").onclick = closeLyrics;
$("btnLogin").onclick = openLogin;
$("btnCloseLogin").onclick = closeLogin;
$("loginLayer").addEventListener("click", function (e) { if (e.target === this) closeLogin(); });

audio.addEventListener("timeupdate", onTime);
audio.addEventListener("play", function () { S.failGuard = 0; setPlaying(true); });
audio.addEventListener("pause", function () { setPlaying(false); });
audio.addEventListener("ended", onEnded);
audio.addEventListener("error", function () { onPlayFail(); });
window.addEventListener("resize", function () { scrollLrc(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if ($("lyrQueue").classList.contains("on")) $("lyrQueue").classList.remove("on");
    else if ($("lyrView").classList.contains("on")) closeLyrics();
    else if ($("loginLayer").classList.contains("on")) closeLogin();
  }
});

bindSeek($("prog"), "progFill", ".knob");
bindSeek($("lyrProg"), "lyrProgFill", ".knob");

imgFallback($("coverImg"));
imgFallback($("lyrImg"));
audio.volume = .85;
parseLoginReturn();

})();
</script>
