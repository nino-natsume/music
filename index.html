$("playAll").onclick = function () { if (S.list.length) setQueue(S.list, 0); };

function clickPlay() {
  if (!audio.src) {
    /* 无音源（上一轮全部失败）→ 重新从头加载当前这首 */
    if (S.list.length) playItem(S.idx >= 0 ? S.idx : 0);
    return;
  }
  if (audio.paused) {
    S.pausedByUser = false;
    setBusy(true);
    audio.play().catch(function (err) { onPlayFail(err); });
  } else {
    S.pausedByUser = true;
    clearT("watchT");
    S.watching = false;
    setBusy(false);
    audio.pause();
  }
}
function stepPrev() { if (S.list.length) playItem(S.idx > 0 ? S.idx - 1 : S.list.length - 1); }
function stepNext() { if (S.list.length) playItem(S.idx < S.list.length - 1 ? S.idx + 1 : 0); }
$("btnPlay").onclick = clickPlay;
$("btnLyrPlay").onclick = clickPlay;
$("btnPrev").onclick = stepPrev;
$("btnLyrPrev").onclick = stepPrev;
$("btnNext").onclick = stepNext;
$("btnLyrNext").onclick = stepNext;
$("btnLyrMode").onclick = function () { setMode((S.mode + 1) % 3); };
$("btnLyrQueue").onclick = function () { $("lyrQueue").classList.toggle("on"); };
$("btnLyrQueueClose").onclick = function () { $("lyrQueue").classList.remove("on"); };
$("coverBtn").onclick = openLyrics;
$("nowBtn").onclick = openLyrics;
$("btnLyrClose").onclick = closeLyrics;
$("btnLogin").onclick = openLogin;
$("btnCloseLogin").onclick = closeLogin;
$("mineCard").addEventListener("click", function (e) {

});
$("plForm").addEventListener("submit", function (e) { e.preventDefault(); importPlaylist(); });
$("plForm").addEventListener("keydown", function (e) {
  /* 歌单 id 很长，用逗号分隔可以一次贴多个 */
  if (e.key !== "Enter" || e.shiftKey) return;
  var raw = $("plId").value;
  if (raw.indexOf(",") < 0) return;
  e.preventDefault();
  var ids = raw.split(",").map(parsePlInput).filter(Boolean);
  var btn = $("btnPlAdd");
  btn.disabled = true;
  /* 一次只发一个请求，避免把上游打爆 */
  (function step(i) {
    if (i >= ids.length) {
      btn.disabled = false;
      btn.textContent = "导入";
      $("plId").value = "";
      return;
    }
    apiJSON("playlist", ids[i], S.server, 0, 1).then(function (data) {
      var list = toList(data, S.server);
      if (list.length) {
        var f = list[0] || {};
        addPlaylist(ids[i], { n: list.length, pic: f.pic || "", first: f.title || "" });
      }
      step(i + 1);
    }).catch(function () { step(i + 1); });
  })(0);
  btn.textContent = "导入中…";
});

$("loginLayer").addEventListener("click", function (e) { if (e.target === this) closeLogin(); });

audio.addEventListener("playing", function () {
  /* 真正开始出声：清掉加载看门狗，重置同源重试计数 */
  clearT("watchT");
  S.watching = false;
  S.same = 0;

audio.addEventListener("error", function (e) {
  var me = e.target.error;
  if (me && me.code === 1) return;   /* ABORTED：被主动打断，不算失败 */

});

var MODE_TIPS = ["顺序播放", "单曲循环", "随机播放"];
var MODE_SHORT = ["顺序", "单曲", "随机"];
function setMode(m) {
  S.mode = m;
  var b = $("btnLyrMode");
  b.setAttribute("data-mode", String(m));
  b.querySelector(".tx").textContent = MODE_SHORT[m];
  b.title = MODE_TIPS[m];
  b.setAttribute("aria-label", "播放方式：" + MODE_TIPS[m]);
  b.classList.toggle("on", m !== 0);   /* 非默认模式给点色，免得看不出已经切过 */
}
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if ($("srcPop").classList.contains("on")) closeSrcPop();
    else if ($("lyrQueue").classList.contains("on")) $("lyrQueue").classList.remove("on");
    else if ($("lyrView").classList.contains("on")) closeLyrics();
    else if ($("loginLayer").classList.contains("on")) closeLogin();
    return;
  }
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  /* 快捷键：空格播放/暂停，左右快退快进，上下调音量 */
  if (e.key === " " || e.code === "Space") { e.preventDefault(); clickPlay(); return; }
  if (!audio.src) return;
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    audio.currentTime = Math.max(0, audio.currentTime - (e.shiftKey ? 30 : 5));
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    audio.currentTime = Math.min(isFinite(audio.duration) ? audio.duration : 1e9, audio.currentTime + (e.shiftKey ? 30 : 5));
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    audio.volume = Math.min(1, audio.volume + .05);
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    audio.volume = Math.max(0, audio.volume - .05);
  }
});
