# Cloudflare Workers 配置 —— 云音乐播放器
# 部署：
#   npm i -g wrangler
#   wrangler login
#   wrangler deploy
# 本地预览：
#   直接浏览器打开 index.html（自动直连 https://api.107211.xyz）

name = "music-player"
main = "worker.js"
compatibility_date = "2025-01-01"

# Dashboard 里设的变量在 deploy 时保留。
# wrangler 默认把本文件当非加密变量的唯一真相源：每次 deploy 先删掉 Worker 上所有
# plain-text 变量再写回这里有的 —— 只在 Dashboard 设的 OAUTH_ON 会被抹掉。
# 加上这行后只覆盖本文件出现的变量名；代价是从本文件删名不会连带删掉 Dashboard 的。
keep_vars = true

# 可选：绑定自定义域名（把 music.107211.xyz 解析到本 Worker）
# routes = [
#   { pattern = "music.107211.xyz/*", zone_name = "107211.xyz" }
# ]

# 可选：如需上游鉴权（api.107211.xyz 要求时）——
# 不要写进本文件，用命令设置：
#   wrangler secret put MUSIC_TOKEN

# =========================================================
# 功能开关：故意不在本文件里配
# ------------------------------------------------------------
# OAUTH_ON —— 登录入口。关闭时顶栏不出现登录按钮，也不接受 OAuth 回调、
#              不保存播放进度、播放条不显示账号清单。
#
# 只认这四个值（大小写空格无所谓）：true / 1 / yes / on
# 其余一律算关：未配置、空串、off、false、no、0、乃至拼错的 "ture"。
# 宁可关错，不能关反。
#
# 要改就只在 Cloudflare Dashboard 里改，别写进 [vars]：
#   Workers & Pages → 你的 Worker → Settings → Variables and Secrets
#   → Add variable → Name: OAUTH_ON  Value: "true"  Type: Text
#
# 为什么不放 [vars]：
#   1. Dashboard 里的设置容易被配置文件盖掉，两个地方各说各话很难查；
#   2. 配置跟着环境走，不跟着 git 走 —— 同一仓库 fork 出多份部署时互不影响；
#   3. 变量名和说明不写进版本库，改名/下线开关不用发 commit。
#
# 改完不用重新 deploy，直接生效：前端每次打开页面都会问一次 /config。
# =========================================================

# 说明：
# - worker.js 由 build.js 从 index.html 自动生成
# - 修改页面样式/逻辑后：改 index.html → 运行 `node build.js` → `wrangler deploy`
# - 媒体链路：Worker 只解析地址（/resolve、/stream、/cover 都是 307），
#   音频与封面字节由浏览器直连网易云 CDN。CDN 屏蔽 Cloudflare 出口 IP，
#   任何在 Worker 里回源取流改法都会 525，别再改回去
# - 登录使用 oauth.107211.xyz（GitHub / Twitter / Microsoft），
#   登录后会自动带参数跳回本页面展示用户信息